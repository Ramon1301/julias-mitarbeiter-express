<!doctype html>

<canvas id="c"></canvas>
<script>
/* =====================================================================
   FÜR DIE SCHLECHTEN ZEITEN
   Johann hält eine Rede am Pult – und du bewirfst ihn mit Tomaten,
   Eiern, Torten und Wassermelonen. Tippen = werfen. 60 Sekunden.
   Alles ist Vektorgrafik → scharf auf jedem Bildschirm.
   ===================================================================== */
const cv = document.getElementById('c'); let g = cv.getContext('2d');
// Logische Spielfläche – im Hochformat schmal und hoch (füllt das Handy ganz aus), sonst breit.
let VW = 1000, VH = 620, PORTRAIT = false, STAGE_Y = 520, PULT_X = 500, SCALE = .9, BANNER_Y = 104, TY = 0;
let TRAY = [], BTN_HOME, BTN_BACK, BTN_SCORE, BTN_MUTE, PICK, BTN_SWITCH, JO = null;
const CROUCH = 78;
let S = 1, OX = 0, OY = 0, DPR = 1;
function fit() {
  DPR = Math.min(devicePixelRatio || 1, 2);
  cv.width = innerWidth * DPR; cv.height = innerHeight * DPR;
  PORTRAIT = false;   // immer das klassische Querformat-Layout – im Hochformat wird es einfach kleiner angezeigt (ohne Dreh-Aufforderung)
  VW = PORTRAIT ? 620 : 1000;
  VH = PORTRAIT ? Math.round(Math.min(1400, Math.max(900, 620 * innerHeight / innerWidth))) : 620;
  STAGE_Y = VH - (PORTRAIT ? 170 : 100); PULT_X = VW / 2; SCALE = PORTRAIT ? 1.18 : .8;
  BANNER_Y = PORTRAIT ? 190 : 104; TY = PORTRAIT ? Math.round((VH - 620) / 2) : 0;
  S = Math.min(innerWidth / VW, innerHeight / VH);
  OX = (innerWidth - VW * S) / 2; OY = (innerHeight - VH * S) / 2;
  const tw = Math.min(VW - 32, PORTRAIT ? 588 : 520), th = PORTRAIT ? 120 : 96, tx0 = (VW - tw) / 2, ty0 = VH - th - (PORTRAIT ? 24 : 10);
  TRAY = [0, 1, 2, 3].map(i => ({ x: tx0 + tw / 4 * (i + .5), y: ty0 + th / 2, w: tw / 4, h: th, x0: tx0 + tw / 4 * i, y0: ty0 }));
  TRAY.box = { x: tx0, y: ty0, w: tw, h: th };
  BTN_BACK = { x: 20, y: 18, w: 160, h: 50 }; BTN_HOME = { x: 18, y: 18, w: 54, h: 54 }; BTN_SCORE = { x: VW - 252, y: 20, w: 170, h: 50 }; BTN_MUTE = { x: VW - 72, y: 18, w: 54, h: 54 };
  PICK = ['Julia', 'Joris', 'Ramon'].map((n, i) => ({ n, x: VW / 2 - 270 + i * 190, y: 372, w: 160, h: 64 }));   // y relativ zum Menü (+TY)
  BTN_SWITCH = { x: VW / 2 - 90, y: 560, w: 180, h: 36 };
  if (JO) { JO.y = STAGE_Y; JO.x = clamp(JO.x, VW * .15, VW * .85); JO.tx = clamp(JO.tx, VW * .15, VW * .85); }
}
addEventListener('resize', fit);

const OUT = '#2a1d2e';
const COL = { coral: '#ff8c6b', gold: '#ffd166', cream: '#fff0d6', teal: '#3a7f8f', tealDk: '#285c69', pink: '#f472b6' };
const FONT = (w, s) => `${w} ${s}px 'Baloo 2', system-ui, sans-serif`;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const store = { get(k, d) { try { const v = localStorage.getItem('fdsz.' + k); return v ? JSON.parse(v) : d; } catch { return d; } }, set(k, v) { try { localStorage.setItem('fdsz.' + k, JSON.stringify(v)); } catch {} } };

/* ---------------- Wurfgeschosse ---------------- */
const ITEMS = [
  { key: 'tomato', name: 'Tomate', pts: 10, speed: .55, r: 16, cool: .22 },
  { key: 'egg', name: 'Ei', pts: 15, speed: .5, r: 13, cool: .3 },
  { key: 'pie', name: 'Torte', pts: 25, speed: .7, r: 22, cool: .55 },
  { key: 'melon', name: 'Melone', pts: 40, speed: .9, r: 28, cool: 1.0 },
];
function drawItem(key, x, y, r, rot = 0) {
  g.save(); g.translate(x, y); g.rotate(rot); g.lineWidth = Math.max(2, r * .14); g.strokeStyle = OUT; g.lineJoin = 'round';
  if (key === 'tomato') {
    g.fillStyle = '#e8402e'; g.beginPath(); g.ellipse(0, 0, r, r * .9, 0, 0, 7); g.fill(); g.stroke();
    g.fillStyle = 'rgba(255,255,255,.45)'; g.beginPath(); g.ellipse(-r * .35, -r * .35, r * .25, r * .15, -.6, 0, 7); g.fill();
    g.fillStyle = '#3fa34d'; g.beginPath(); for (let i = 0; i < 5; i++) { const a = i / 5 * 6.28; g.moveTo(0, -r * .8); g.lineTo(Math.cos(a) * r * .45, -r * .8 + Math.sin(a) * r * .3); } g.lineWidth = r * .12; g.strokeStyle = '#3fa34d'; g.stroke();
  } else if (key === 'egg') {
    g.fillStyle = '#fff8ee'; g.beginPath(); g.ellipse(0, 0, r * .8, r, 0, 0, 7); g.fill(); g.stroke();
    g.fillStyle = 'rgba(42,29,46,.08)'; g.beginPath(); g.ellipse(r * .2, r * .2, r * .45, r * .6, 0, 0, 7); g.fill();
  } else if (key === 'pie') {
    g.fillStyle = '#d9a35b'; g.beginPath(); g.ellipse(0, r * .25, r, r * .55, 0, 0, 7); g.fill(); g.stroke();
    g.fillStyle = '#fff8ee'; g.beginPath(); g.ellipse(0, -r * .05, r * .92, r * .5, 0, 0, 7); g.fill(); g.stroke();
    for (const dx of [-.45, 0, .45]) { g.fillStyle = '#fff8ee'; g.beginPath(); g.arc(dx * r, -r * .35, r * .22, 0, 7); g.fill(); g.stroke(); }
    g.fillStyle = '#e8402e'; g.beginPath(); g.arc(0, -r * .55, r * .16, 0, 7); g.fill(); g.stroke();
  } else {
    // Wassermelone: hellgrün mit dunklen, gezackten Streifen, Glanzlicht und Stielansatz
    const rx = r * 1.08, ry = r * .82;
    g.save(); g.beginPath(); g.ellipse(0, 0, rx, ry, 0, 0, 7); g.closePath();
    const grd = g.createRadialGradient(-rx * .35, -ry * .4, r * .1, 0, 0, rx); grd.addColorStop(0, '#9be07a'); grd.addColorStop(1, '#4fa83c');
    g.fillStyle = grd; g.fill(); g.clip();
    g.fillStyle = '#23662c';
    for (let k = -3; k <= 3; k++) {
      const cx = k * rx * .3; g.beginPath(); g.moveTo(cx, -ry * 1.1);
      for (let yy = -ry; yy <= ry; yy += ry / 5) g.lineTo(cx + (Math.round(yy / (ry / 5)) % 2 ? r * .1 : -r * .1) * (1 - Math.abs(k) * .12), yy);
      g.lineTo(cx + r * .02, ry * 1.1); for (let yy = ry; yy >= -ry; yy -= ry / 5) g.lineTo(cx + r * .14 + (Math.round(yy / (ry / 5)) % 2 ? r * .1 : -r * .1) * (1 - Math.abs(k) * .12), yy);
      g.closePath(); g.fill();
    }
    g.fillStyle = 'rgba(255,255,255,.32)'; g.beginPath(); g.ellipse(-rx * .42, -ry * .45, rx * .32, ry * .16, -.4, 0, 7); g.fill();
    g.restore();
    g.beginPath(); g.ellipse(0, 0, rx, ry, 0, 0, 7); g.lineWidth = Math.max(2, r * .12); g.strokeStyle = OUT; g.stroke();
    g.fillStyle = '#7a5a2e'; g.beginPath(); g.ellipse(-rx * .96, 0, r * .1, r * .16, 0, 0, 7); g.fill(); g.lineWidth = 2; g.stroke();
  }
  g.restore();
}
// Spritzer (bleiben an Johann oder an der Wand kleben)
function drawSplat(sp) {
  g.save(); g.translate(sp.x, sp.y); g.rotate(sp.rot); g.scale(sp.s, sp.s); g.globalAlpha = sp.a ?? 1;
  const blobs = sp.blobs;
  if (sp.key === 'tomato') { g.fillStyle = '#d93a2b'; blobs.forEach(b => { g.beginPath(); g.ellipse(b[0], b[1], b[2], b[2] * .8, 0, 0, 7); g.fill(); }); g.fillStyle = '#ffd38a'; blobs.slice(0, 4).forEach(b => { g.beginPath(); g.ellipse(b[0] * .5, b[1] * .5, 2, 1.4, 0, 0, 7); g.fill(); }); }
  else if (sp.key === 'egg') { g.fillStyle = '#fff8ee'; blobs.forEach(b => { g.beginPath(); g.arc(b[0], b[1], b[2], 0, 7); g.fill(); }); g.fillStyle = '#ffc533'; g.beginPath(); g.arc(0, 0, 8, 0, 7); g.fill(); g.fillStyle = 'rgba(255,255,255,.5)'; g.beginPath(); g.arc(-2, -2, 2.5, 0, 7); g.fill(); }
  else if (sp.key === 'pie') { g.fillStyle = '#fffaf2'; blobs.forEach(b => { g.beginPath(); g.arc(b[0], b[1], b[2] * 1.2, 0, 7); g.fill(); }); g.fillStyle = '#e8402e'; g.beginPath(); g.arc(3, -4, 4, 0, 7); g.fill(); g.fillStyle = '#d9a35b'; g.fillRect(-10, 6, 8, 4); }
  else { g.fillStyle = '#ff5a6b'; blobs.forEach(b => { g.beginPath(); g.arc(b[0], b[1], b[2], 0, 7); g.fill(); }); g.fillStyle = '#2a1d2e'; blobs.slice(0, 7).forEach(b => { g.beginPath(); g.ellipse(b[0] * .6, b[1] * .6, 1.6, 2.6, .5, 0, 7); g.fill(); }); g.fillStyle = '#3f9d4a'; g.fillRect(-14, 10, 12, 4); g.fillRect(6, -14, 10, 4); }
  g.restore();
}
function makeSplat(key, x, y, size) {
  const n = key === 'melon' ? 12 : key === 'pie' ? 9 : 7, blobs = [];
  for (let i = 0; i < n; i++) { const a = rand(0, 6.28), d = i === 0 ? 0 : rand(4, 16); blobs.push([Math.cos(a) * d, Math.sin(a) * d, i === 0 ? 11 : rand(3, 7)]); }
  return { key, x, y, s: size, rot: rand(0, 6.28), blobs, life: 1 };
}

/* =====================================================================
   JOHANN – Karikatur (großer Kopf, Haartolle, runde Brille, Dreitagebart,
   mintgrüner Anzug, hellblaues Hemd, weiße Sneaker, „Raute"-Hände)
   Ursprung = zwischen den Füßen. Höhe ≈ 330.
   ===================================================================== */
const J = { skin: '#f3cdb2', skinSh: '#e2ad90', stubble: 'rgba(120,80,55,.22)', hair: '#8b6640', hairDk: '#664a2c', hairHi: '#b38b5c',
  suit: '#a9cfa8', suitSh: '#8ab889', suitDk: '#6f9d6e', shirt: '#bfe0f5', shoe: '#f3eee4', sock: '#5b8fd6' };
function limb(x1, y1, x2, y2, w, col) {
  g.lineCap = 'round'; g.strokeStyle = OUT; g.lineWidth = w + 6; g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
  g.strokeStyle = col; g.lineWidth = w; g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
}
function shape(fill, path, lw = 4) { g.beginPath(); path(); g.closePath(); g.fillStyle = fill; g.fill(); g.lineWidth = lw; g.strokeStyle = OUT; g.lineJoin = 'round'; g.stroke(); }
function drawJohann(jx, jy, sc, st) {
  // st: { t, mood: 'smug'|'hit'|'angry'|'duck', hands: 'raute'|'up'|'point', duck: 0..1, walk }
  g.save(); g.translate(jx, jy); g.scale(sc, sc);
  const D = st.duck * CROUCH, bob = Math.sin(st.t * 3) * 2 * (1 - st.duck), step = Math.sin(st.walk) * 10 * (1 - st.duck);
  // Schatten
  g.fillStyle = 'rgba(42,29,46,.22)'; g.beginPath(); g.ellipse(0, 4, 70, 12, 0, 0, 7); g.fill();
  // Beine (mintgrüne Hose): Hüfte sinkt beim Ducken, Knie knicken nach außen → echtes In-die-Hocke-Gehen
  for (const s of [-1, 1]) {
    const fx = s * (22 + st.duck * 18) + (s > 0 ? step : -step) * .6, fy = -16, hx = s * 18, hy = -150 + D;
    const dx = fx - hx, dy = fy - hy, d = Math.hypot(dx, dy), seg = 68, k = Math.sqrt(Math.max(0, seg * seg - (d / 2) ** 2));
    const kx = (hx + fx) / 2 + s * k * dy / d, ky = (hy + fy) / 2 - s * k * dx / d;
    limb(hx, hy, kx, ky, 31, J.suit); limb(kx, ky, fx, fy, 28, J.suit);
    g.strokeStyle = J.suitSh; g.lineWidth = 3; g.beginPath(); g.moveTo(kx - s * 6, ky); g.lineTo(fx - s * 6, fy - 6); g.stroke();
    g.fillStyle = J.sock; g.fillRect(fx - 12, -24, 24, 10);
    shape(J.shoe, () => { g.moveTo(fx - 16, -14); g.quadraticCurveTo(fx - 18, 4, fx, 4); g.lineTo(fx + 26, 4); g.quadraticCurveTo(fx + 30, -6, fx + 18, -12); g.quadraticCurveTo(fx, -20, fx - 16, -14); });
    g.strokeStyle = '#c9bfa8'; g.lineWidth = 2.4; for (const q of [0, 6, 12]) { g.beginPath(); g.moveTo(fx - 4 + q, -12); g.lineTo(fx + 2 + q, -2); g.stroke(); }
    g.fillStyle = '#c9a77a'; g.fillRect(fx - 16, 0, 44, 4);
  }
  g.translate(0, D + bob);
  // Oberkörper: Sakko
  shape(J.suit, () => { g.moveTo(-58, -270); g.quadraticCurveTo(0, -284, 58, -270); g.quadraticCurveTo(70, -210, 60, -140); g.lineTo(-60, -140); g.quadraticCurveTo(-70, -210, -58, -270); });
  g.fillStyle = J.suitSh; g.beginPath(); g.moveTo(-58, -270); g.quadraticCurveTo(-70, -210, -60, -140); g.lineTo(-40, -140); g.quadraticCurveTo(-50, -210, -40, -268); g.fill();
  // Hemd + Revers
  shape(J.shirt, () => { g.moveTo(-20, -276); g.lineTo(20, -276); g.lineTo(6, -200); g.lineTo(-6, -200); }, 3);
  shape(J.suitDk, () => { g.moveTo(-22, -276); g.lineTo(-4, -196); g.lineTo(-30, -222); g.lineTo(-36, -250); }, 3);
  shape(J.suitDk, () => { g.moveTo(22, -276); g.lineTo(4, -196); g.lineTo(30, -222); g.lineTo(36, -250); }, 3);
  g.fillStyle = '#e8f3f2'; for (const y of [-185, -160]) { g.beginPath(); g.arc(0, y, 4, 0, 7); g.fill(); g.lineWidth = 2; g.strokeStyle = OUT; g.stroke(); }
  g.strokeStyle = J.suitDk; g.lineWidth = 3; g.beginPath(); g.moveTo(26, -232); g.lineTo(48, -232); g.stroke();
  // Arme + Hände
  if (st.hands === 'up') {                                 // Hände schützend hoch
    limb(-52, -262, -70, -300, 26, J.suit); limb(-70, -300, -40, -330, 22, J.suit);
    limb(52, -262, 70, -300, 26, J.suit); limb(70, -300, 40, -330, 22, J.suit);
    for (const s of [-1, 1]) { shape(J.skin, () => g.ellipse(s * 36, -338, 14, 16, 0, 0, 7), 3.5); }
  } else if (st.hands === 'point') {                       // erhobener Zeigefinger (Rede!)
    limb(-52, -262, -46, -200, 26, J.suit); limb(-46, -200, -20, -172, 22, J.suit); shape(J.skin, () => g.ellipse(-14, -168, 13, 12, 0, 0, 7), 3.5);
    limb(52, -262, 84, -300, 26, J.suit); limb(84, -300, 90, -350, 22, J.suit);
    shape(J.skin, () => g.ellipse(90, -360, 12, 13, 0, 0, 7), 3.5); limb(92, -370, 94, -392, 6, J.skin);
  } else {                                                 // die berühmte „Raute"
    limb(-52, -262, -50, -196, 26, J.suit); limb(-50, -196, -16, -176, 22, J.suit);
    limb(52, -262, 50, -196, 26, J.suit); limb(50, -196, 16, -176, 22, J.suit);
    shape(J.skin, () => { g.moveTo(-16, -186); g.lineTo(0, -200); g.lineTo(16, -186); g.lineTo(0, -160); }, 3.5);
    g.fillStyle = J.suit; g.beginPath(); g.moveTo(-6, -184); g.lineTo(0, -190); g.lineTo(6, -184); g.lineTo(0, -174); g.fill();
  }
  // Hals
  shape(J.skinSh, () => g.rect(-14, -296, 28, 26), 3);
  drawHead(st);
  // Spritzer, die an Johann kleben (lokale Koordinaten)
  for (const sp of st.stains) drawSplat(sp);
  g.restore();
}
function drawHead(st) {
  g.save(); g.translate(0, -370);
  const tilt = st.mood === 'hit' ? Math.sin(st.t * 40) * .06 : Math.sin(st.t * 1.6) * .03; g.rotate(tilt);
  // Haare hinten
  shape(J.hairDk, () => g.ellipse(0, -30, 86, 74, 0, 0, 7), 4);
  // Ohren
  for (const s of [-1, 1]) shape(J.skin, () => g.ellipse(s * 80, 10, 14, 20, 0, 0, 7), 3.5);
  // Gesicht (großer, runder Karikatur-Kopf)
  shape(J.skin, () => { g.moveTo(-76, -20); g.bezierCurveTo(-80, -90, 80, -90, 76, -20); g.bezierCurveTo(78, 50, 40, 82, 0, 84); g.bezierCurveTo(-40, 82, -78, 50, -76, -20); });
  // Dreitagebart
  g.save(); g.beginPath(); g.moveTo(-70, 18); g.bezierCurveTo(-60, 70, -30, 84, 0, 84); g.bezierCurveTo(30, 84, 60, 70, 70, 18); g.bezierCurveTo(50, 46, 30, 30, 0, 32); g.bezierCurveTo(-30, 30, -50, 46, -70, 18); g.fillStyle = J.stubble; g.fill();
  g.fillStyle = 'rgba(100,65,45,.35)'; for (let i = 0; i < 70; i++) { const a = rand(.2, 2.9), r = rand(55, 78); g.fillRect(Math.cos(a) * r * .9, 20 + Math.sin(a) * r * .75, 1.6, 1.6); }
  g.restore();
  // Wangen
  g.fillStyle = 'rgba(235,120,110,.28)'; g.beginPath(); g.ellipse(-46, 22, 16, 10, 0, 0, 7); g.ellipse(46, 22, 16, 10, 0, 0, 7); g.fill();
  // Augen hinter der Brille
  const angry = st.mood === 'angry', hitM = st.mood === 'hit', cry = st.mood === 'cry';
  for (const s of [-1, 1]) {
    const ex = s * 33, ey = -6;
    if (cry) { g.strokeStyle = OUT; g.lineWidth = 5; g.lineCap = 'round'; g.beginPath(); g.arc(ex, ey + 6, 10, 3.6, 5.8); g.stroke(); }
    else if (hitM) { g.strokeStyle = OUT; g.lineWidth = 4; g.beginPath(); g.moveTo(ex - 9, ey - 6); g.lineTo(ex + 9, ey + 6); g.moveTo(ex + 9, ey - 6); g.lineTo(ex - 9, ey + 6); g.stroke(); }
    else { shape('#fff', () => g.ellipse(ex, ey, 11, angry ? 7 : 12, 0, 0, 7), 2.5); g.fillStyle = '#5a4632'; g.beginPath(); g.arc(ex + 2, ey + 1, 6, 0, 7); g.fill(); g.fillStyle = OUT; g.beginPath(); g.arc(ex + 2, ey + 1, 3, 0, 7); g.fill(); g.fillStyle = '#fff'; g.beginPath(); g.arc(ex + 4, ey - 2, 1.8, 0, 7); g.fill(); }
  }
  // runde schwarze Brille
  g.lineWidth = 7; g.strokeStyle = '#1a1418';
  for (const s of [-1, 1]) { g.beginPath(); g.arc(s * 33, -4, 25, 0, 7); g.stroke(); g.fillStyle = 'rgba(200,230,255,.18)'; g.fill(); }
  g.beginPath(); g.moveTo(-9, -8); g.quadraticCurveTo(0, -14, 9, -8); g.stroke();
  g.beginPath(); g.moveTo(-58, -8); g.lineTo(-78, -4); g.moveTo(58, -8); g.lineTo(78, -4); g.stroke();
  g.strokeStyle = 'rgba(255,255,255,.6)'; g.lineWidth = 3; for (const s of [-1, 1]) { g.beginPath(); g.arc(s * 33, -4, 17, 3.6, 4.4); g.stroke(); }
  // Tränenbäche (laufen unter der Brille hervor)
  if (cry) for (const s of [-1, 1]) {
    const k = (st.t * 2) % 1;
    shape('#7cc8f2', () => { g.moveTo(s * 30, 14); g.quadraticCurveTo(s * 40, 40, s * 34, 72); g.lineTo(s * 26, 72); g.quadraticCurveTo(s * 30, 40, s * 22, 14); }, 3);
    shape('#a8dcf7', () => g.ellipse(s * 34 + s * k * 18, 74 + k * 60, 7, 9, 0, 0, 7), 3);
  }
  // Augenbrauen
  g.strokeStyle = J.hairDk; g.lineWidth = 7; g.lineCap = 'round';
  for (const s of [-1, 1]) { g.beginPath(); if (cry) { g.moveTo(s * 52, -34); g.quadraticCurveTo(s * 34, -38, s * 16, -50); } else if (angry) { g.moveTo(s * 50, -40); g.lineTo(s * 16, -30); } else if (hitM) { g.moveTo(s * 50, -42); g.quadraticCurveTo(s * 33, -54, s * 16, -44); } else { g.moveTo(s * 50, -38); g.quadraticCurveTo(s * 33, -46, s * 16, -40); } g.stroke(); }
  // Nase
  g.strokeStyle = J.skinSh; g.lineWidth = 4; g.beginPath(); g.moveTo(2, 4); g.quadraticCurveTo(12, 26, 0, 30); g.stroke();
  // Mund
  g.strokeStyle = OUT; g.lineWidth = 5;
  if (cry) { shape('#7a2a35', () => { g.moveTo(-26, 60); g.quadraticCurveTo(0, 30, 26, 60); g.quadraticCurveTo(0, 74, -26, 60); }, 4); shape('#e86a7a', () => g.ellipse(0, 62, 12, 5, 0, 0, 7), 0); }
  else if (hitM) { shape('#7a2a35', () => g.ellipse(0, 52, 14, 18, 0, 0, 7), 4); }
  else if (angry) { g.beginPath(); g.moveTo(-20, 56); g.quadraticCurveTo(0, 46, 20, 56); g.stroke(); }
  else { g.beginPath(); g.moveTo(-24, 46); g.quadraticCurveTo(4, 64, 26, 42); g.stroke(); g.lineWidth = 3; g.beginPath(); g.moveTo(26, 42); g.lineTo(30, 38); g.stroke(); }  // verschmitztes Grinsen

/* ---------------- Spielzustand ---------------- */

const PLAYERS = { Julia: '#f472b6', Joris: '#4ade80', Ramon: '#38bdf8' };

setInterval(() => { if (!document.hidden && state !== 'play') loadBoard(); }, 15000);   // Bestenliste aktuell halten

let state = 'title', time = 60, score = 0, combo = 0, best = store.get('best', 0), hits = 0, throws = 0;
let sel = 0, cool = 0, projectiles = [], wallSplats = [], particles = [], floaters = [], bubble = null;
const jo = { x: 300, tx: 300, y: STAGE_Y, walk: 0, duck: 0, duckT: 0, mood: 'smug', moodT: 0, hands: 'raute', handsT: 0, stains: [], speed: 90, bubbleT: 2 };
const QUOTES = ['Neue Wege gehen!', 'Wir müssen reden!', 'Das ist Dialog!', 'Bitte sachlich bleiben!', 'Ich bin offen für Kritik!', 'Nächster Punkt!', 'Wir brauchen mehr Digitalisierung!', 'Das nehme ich mal mit!', 'Lasst uns das priorisieren!', 'Ich habe einen Plan!', 'Das klären wir im Ausschuss!', 'Mehr Mut zur Zukunft!'];

const HIT_QUOTES = ['Hey!', 'Meine Brille!', 'Mein Anzug!!', 'Das war neu!', 'Unsachlich!', 'Aua!', 'Nicht die Haare!', 'Mehr Digitalisierung!'];
                                         // Johanns Größe auf der Bühne

function reset() {
  time = 60; score = 0; combo = 0; hits = 0; throws = 0; projectiles = []; wallSplats = []; particles = []; floaters = [];
  Object.assign(jo, { x: VW * .3, tx: VW * .64, y: STAGE_Y, walk: 0, duck: 0, duckT: 4, mood: 'smug', moodT: 0, hands: 'point', handsT: 2, stains: [], speed: 110, bubbleT: 1.5 });
  bubble = { text: 'Neue Wege gehen!', t: 2.2 };
}

/* ---------------- Ton ---------------- */
let actx = null, muted = store.get('muted', false);
function audio() { if (!actx) try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch {} if (actx?.state === 'suspended') actx.resume(); }
function noise(dur, vol, freq) {
  if (!actx || muted) return;
  const len = actx.sampleRate * dur, b = actx.createBuffer(1, len, actx.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
  const s = actx.createBufferSource(), f = actx.createBiquadFilter(), gn = actx.createGain();
  s.buffer = b; f.type = 'lowpass'; f.frequency.value = freq; gn.gain.value = vol; s.connect(f).connect(gn).connect(actx.destination); s.start();
}
function tone(fr, dur, vol = .05, slide = 0, type = 'sine') {
  if (!actx || muted) return; const t = actx.currentTime, o = actx.createOscillator(), gn = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(fr, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, fr + slide), t + dur);
  gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(.0001, t + dur); o.connect(gn).connect(actx.destination); o.start(); o.stop(t + dur);
}
const SFX = { pick: () => tone(880, .06, .03), throw: () => tone(500, .15, .04, 500), splat: big => { noise(big ? .45 : .25, big ? .5 : .35, big ? 900 : 1600); tone(big ? 90 : 140, .2, .08, -40, 'triangle'); }, miss: () => noise(.2, .15, 800), oof: () => tone(220, .25, .05, -80, 'square') };

/* ---------------- Eingabe ---------------- */
function toV(e) { return { x: (e.clientX - OX) / S, y: (e.clientY - OY) / S }; }
const inR = (p, r) => p.x > r.x && p.x < r.x + r.w && p.y > r.y && p.y < r.y + r.h;
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); audio();
  const p = toV(e);
  if (boardOpen) { boardOpen = false; return; }
  if (inR(p, BTN_MUTE)) { muted = !muted; store.set('muted', muted); return; }
  if (state !== 'play' && inR(p, BTN_SCORE)) { boardOpen = true; loadBoard(); return; }
  if (state === 'title' && inR(p, BTN_BACK)) { location.href = 'index.html'; return; }
  if (state !== 'title' && inR(p, BTN_HOME)) { location.href = 'index.html'; return; }
  if (state === 'title') {
    const pm = { x: p.x, y: p.y - TY };
    if (!me) { const k = PICK.find(b => inR(pm, b)); if (k) { me = k.n; try { localStorage.setItem('todo.me', JSON.stringify(me)); } catch {} } return; }
    if (inR(pm, BTN_SWITCH)) { me = null; return; }
    reset(); state = 'play'; return;
  }
  if (state === 'over') { if (overT > 0) return; reset(); state = 'play'; return; }
  const tb = TRAY.box;
  if (p.x > tb.x - 6 && p.x < tb.x + tb.w + 6 && p.y > tb.y - 10) { sel = clamp(Math.floor((p.x - tb.x) / (tb.w / 4)), 0, 3); SFX.pick(); return; }   // ganze Leiste = Auswahl, nie ein Wurf
  throwAt(p.x, p.y);
});
addEventListener('keydown', e => { if (e.key >= '1' && e.key <= '4') sel = +e.key - 1; if (e.key === 'm') { muted = !muted; store.set('muted', muted); } });

function throwAt(tx, ty) {
  if (state !== 'play' || cool > 0) return;
  const it = ITEMS[sel]; cool = it.cool; throws++;
  projectiles.push({ it, sx: VW / 2 + rand(-40, 40), sy: VH + 40, tx, ty: Math.min(ty, STAGE_Y + 30), t: 0, rot: rand(0, 6), spin: rand(-12, 12) });
  SFX.throw();
}

/* ---------------- Logik ---------------- */
let overT = 0;
function johannHitZones() {
  const s = SCALE, x = jo.x, base = jo.y + jo.duck * CROUCH * s;
  return {
    head: { x, y: base - 370 * s - 20 * s, r: 92 * s },
    body: { x: x - 70 * s, y: base - 290 * s, w: 140 * s, h: 160 * s },
    legs: { x: x - 55 * s, y: base - 150 * s, w: 110 * s, h: jo.y - (base - 150 * s) },
  };
}
const behindPult = () => Math.abs(jo.x - PULT_X) < 100;

function update(dt) {
  if (state === 'over') { overT -= dt; }
  if (state !== 'play') { jo.walk += dt * 2; return; }
  time -= dt; cool = Math.max(0, cool - dt);
  if (time <= 0) { time = 0; state = 'over'; overT = 1; if (score > best) { best = score; store.set('best', best); } if (me) saveScore(me, score); return; }
  // Johann läuft hin und her – je später, desto schneller und öfter ducken
  const hurry = 1 + (60 - time) / 45;
  const dx = jo.tx - jo.x;
  if (Math.abs(dx) < 6) { if (Math.random() < dt * 1.5) jo.tx = rand(VW * .17, VW * .83); }
  else { jo.x += Math.sign(dx) * Math.min(Math.abs(dx), jo.speed * hurry * dt); jo.walk += dt * 9; }
  if ((jo.duckT -= dt) <= 0) { jo.duckGoal = jo.duckGoal ? 0 : 1; jo.duckT = jo.duckGoal ? rand(.6, 1.2) : rand(2.5, 5) / hurry; }
  jo.duck += ((jo.duckGoal || 0) - jo.duck) * Math.min(1, dt * 9);
  if ((jo.moodT -= dt) <= 0) jo.mood = combo >= 4 ? 'angry' : 'smug';
  if ((jo.handsT -= dt) <= 0) { jo.hands = Math.random() < .5 ? 'raute' : 'point'; jo.handsT = rand(1.5, 3.5); }
  if ((jo.bubbleT -= dt) <= 0) { bubble = { text: pickQuote(QUOTES, bubble?.text), t: 2.2 }; jo.bubbleT = rand(3.5, 6); }
  if (bubble && (bubble.t -= dt) <= 0) bubble = null;
  // Würfe
  for (const p of projectiles) {
    p.t += dt / p.it.speed; p.rot += p.spin * dt;
    if (p.t >= 1) {
      p.done = true;
      const z = johannHitZones(), hitHead = Math.hypot(p.tx - z.head.x, p.ty - z.head.y) < z.head.r + p.it.r * .5;
      const inRect = r => p.tx > r.x - p.it.r * .4 && p.tx < r.x + r.w + p.it.r * .4 && p.ty > r.y && p.ty < r.y + r.h;
      const hitBody = inRect(z.body) || (!behindPult() && inRect(z.legs));
      const pultBlock = p.tx > PULT_X - 105 && p.tx < PULT_X + 105 && p.ty > STAGE_Y - 185;
      if ((hitHead || hitBody) && !(pultBlock && !hitHead)) {
        combo++; hits++;
        const pts = Math.round(p.it.pts * (hitHead ? 2 : 1) * (1 + Math.min(combo - 1, 9) * .2));
        score += pts;
        floaters.push({ x: p.tx, y: p.ty - 20, text: `+${pts}${hitHead ? ' KOPF!' : ''}`, t: 1, col: hitHead ? COL.gold : '#fff' });
        if (combo >= 3) floaters.push({ x: p.tx, y: p.ty - 54, text: `${combo}er COMBO`, t: 1, col: COL.pink });
        // Spritzer klebt an Johann (in seinen lokalen Koordinaten)
        const s = SCALE, lx = (p.tx - jo.x) / s, ly = (p.ty - jo.y) / s - jo.duck * CROUCH;
        jo.stains.push(makeSplat(p.it.key, lx, ly, p.it.key === 'melon' ? 2.6 : p.it.key === 'pie' ? 2.1 : 1.5));
        if (jo.stains.length > 22) jo.stains.shift();
        jo.mood = 'hit'; jo.moodT = .5; jo.hands = 'up'; jo.handsT = .7;
        if (Math.random() < .5) bubble = { text: pickQuote(HIT_QUOTES, bubble?.text), t: 1.2 };
        SFX.splat(p.it.key === 'melon' || p.it.key === 'pie'); SFX.oof();
        splash(p.tx, p.ty, p.it.key, 18);
        shakeT = p.it.key === 'melon' ? .25 : .1;
      } else {
        combo = 0;
        wallSplats.push(Object.assign(makeSplat(p.it.key, p.tx, p.ty, p.it.key === 'melon' ? 2.4 : 1.6), { a: 1 }));
        if (wallSplats.length > 16) wallSplats.shift();
        splash(p.tx, p.ty, p.it.key, 10); SFX.miss(); SFX.splat(false);
      }
    }
  }
  projectiles = projectiles.filter(p => !p.done);
  particles = particles.filter(q => (q.x += q.vx * dt, q.y += q.vy * dt, q.vy += 900 * dt, (q.t -= dt) > 0));
  floaters = floaters.filter(f => (f.y -= 50 * dt, (f.t -= dt) > 0));
  wallSplats.forEach(w => { w.y += 6 * dt; w.a = Math.max(.25, w.a - dt * .05); });   // läuft langsam die Wand runter
}
let shakeT = 0;
function splash(x, y, key, n) {
  const c = { tomato: ['#e8402e', '#ff7a5c'], egg: ['#ffc533', '#fff8ee'], pie: ['#fffaf2', '#d9a35b'], melon: ['#ff5a6b', '#3f9d4a'] }[key];
  for (let i = 0; i < n; i++) { const a = rand(0, 6.28), v = rand(100, 380); particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 200, t: rand(.4, .8), c: c[i % 2], r: rand(3, 7) }); }
}

/* ---------------- Zeichnen ---------------- */
function render(now) {
  const t = now / 1000;
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.fillStyle = '#2a1d2e'; g.fillRect(0, 0, innerWidth, innerHeight);
  g.translate(OX, OY); g.scale(S, S);
  if (shakeT > 0) g.translate(rand(-6, 6), rand(-6, 6));
  g.save(); g.beginPath(); g.rect(0, 0, VW, VH); g.clip();
  drawStage(t);
  wallSplats.forEach(drawSplat);
  // Johann (hinter dem Pult, wenn er dort steht)
  const st = { t, mood: jo.mood, hands: jo.duck > .35 ? 'up' : jo.hands, duck: jo.duck, walk: jo.walk, stains: jo.stains };
  if (behindPult()) { drawJohann(jo.x, jo.y, SCALE, st); drawPult(); } else { drawPult(); drawJohann(jo.x, jo.y, SCALE, st); }
  // Sprechblase
  if (bubble && state !== 'title') {
    const z = johannHitZones();
    g.font = FONT(800, 26); const w = g.measureText(bubble.text).width + 40;
    // wie in der ersten Version: rechts über dem Kopf, wandert mit Johann mit; kurzer Zipfel nach links unten zum Kopf
    const bx = clamp(jo.x + 120, w / 2 + 12, VW - w / 2 - 12), by = Math.max(z.head.y - z.head.r - 34, 104);
    const tx = clamp(jo.x + 30, bx - w / 2 + 26, bx + w / 2 - 40);
    shape('#fff8ee', () => { g.moveTo(tx, by + 22); g.lineTo(tx - 14, by + 46); g.lineTo(tx + 22, by + 22); }, 4);
    shape('#fff8ee', () => { g.roundRect(bx - w / 2, by - 30, w, 56, 20); }, 4);
    g.fillStyle = '#fff8ee'; g.fillRect(tx + 2, by + 20, 18, 6);
    g.fillStyle = OUT; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(bubble.text, bx, by);
  }
  // Würfe im Flug (Bogen + werden kleiner = fliegen in die Tiefe)
  for (const p of projectiles) {
    const k = p.t, x = p.sx + (p.tx - p.sx) * k, y = p.sy + (p.ty - p.sy) * k - Math.sin(k * Math.PI) * 180, sc = 1.7 - .7 * k;
    drawItem(p.it.key, x, y, p.it.r * sc, p.rot);
  }
  particles.forEach(q => { g.fillStyle = q.c; g.beginPath(); g.arc(q.x, q.y, q.r, 0, 7); g.fill(); });
  floaters.forEach(f => { g.globalAlpha = Math.min(1, f.t * 2); g.font = FONT(800, 34); g.textAlign = 'center'; g.lineWidth = 6; g.strokeStyle = OUT; g.strokeText(f.text, f.x, f.y); g.fillStyle = f.col; g.fillText(f.text, f.x, f.y); g.globalAlpha = 1; });
  g.restore();
  hud();
  if (state === 'title') titleScreen(t);
  if (state === 'over') overScreen(t);
  if (state !== 'play') topButtons();
  if (boardOpen) boardScreen();
}
function pill(x, y, w, h, fill, lw = 4) { shape(fill, () => g.roundRect(x, y, w, h, Math.min(h / 2, 26)), lw); }
function label(txt, x, y, size, fill, align = 'center', stroke = OUT, sw = 7) {
  g.font = FONT(800, size); g.textAlign = align; g.textBaseline = 'middle'; g.lineJoin = 'round';
  if (stroke) { g.lineWidth = sw; g.strokeStyle = stroke; g.strokeText(txt, x, y); }
  g.fillStyle = fill; g.fillText(txt, x, y);
}
function avatarCircle(name, x, y, r) {
  shape(PLAYERS[name], () => g.arc(x, y, r + 4, 0, 7), 4);
  const im = photos[name];
  g.save(); g.beginPath(); g.arc(x, y, r, 0, 7); g.clip();
  if (im && im.complete && im.naturalWidth) g.drawImage(im, x - r, y - r, r * 2, r * 2);
  else { g.fillStyle = '#fff0d6'; g.fillRect(x - r, y - r, r * 2, r * 2); label(name[0], x, y + 2, r * 1.1, PLAYERS[name], 'center', null); }
  g.restore();
}
function topButtons() {
  if (state !== 'title') { shape('rgba(255,240,214,.92)', () => g.roundRect(BTN_HOME.x, BTN_HOME.y, BTN_HOME.w, BTN_HOME.h, 18), 3.5); label('←', BTN_HOME.x + 27, BTN_HOME.y + 27, 30, OUT, 'center', null); }

  if (state !== 'play') { pill(BTN_SCORE.x, BTN_SCORE.y, BTN_SCORE.w, BTN_SCORE.h, COL.gold); label('🏆 Highscore', BTN_SCORE.x + BTN_SCORE.w / 2, BTN_SCORE.y + 27, 24, OUT, 'center', null); }

  const mx = BTN_MUTE.x + 16, my = BTN_MUTE.y + 27;
  g.fillStyle = OUT; g.beginPath(); g.moveTo(mx - 6, my - 6); g.lineTo(mx, my - 6); g.lineTo(mx + 9, my - 14); g.lineTo(mx + 9, my + 14); g.lineTo(mx, my + 6); g.lineTo(mx - 6, my + 6); g.closePath(); g.fill();
  g.lineCap = 'round'; g.lineWidth = 3.5; g.strokeStyle = muted ? '#e0472f' : OUT;
  if (muted) { g.beginPath(); g.moveTo(mx + 15, my - 7); g.lineTo(mx + 29, my + 7); g.moveTo(mx + 29, my - 7); g.lineTo(mx + 15, my + 7); g.stroke(); }
  else { g.beginPath(); g.arc(mx + 10, my, 8, -.8, .8); g.stroke(); g.beginPath(); g.arc(mx + 10, my, 15, -.8, .8); g.stroke(); }
}
function hud() {
  if (state === 'play' || state === 'over') {
    // Punkte
    pill(84, 18, 190, 54, '#ff8c6b');
    if (me) avatarCircle(me, 114, 45, 18);
    label(`${score}`, 200, 46, 36, '#fff');
    // Zeit als Balken-Uhr

    pill(tx, ty, tw, 54, '#fff0d6');
    shape(time < 10 ? '#e0472f' : '#5fb3bf', () => g.roundRect(tx + 8, ty + 10, Math.max(20, (tw - 16) * time / 60), 34, 17), 3);
    label(`${Math.ceil(time)} s`, VW / 2, ty + 28, 30, '#fff');
    if (combo >= 2) { g.save(); g.translate(PORTRAIT ? VW - 110 : VW / 2 + 190, PORTRAIT ? 270 : 46); g.rotate(-.06); pill(-70, -24, 140, 48, COL.pink); label(`Combo x${combo}`, 0, 1, 24, '#fff', 'center', null); g.restore(); }
  }
  topButtons();
  // Wurfleiste: vier große Felder, das gewählte leuchtet golden
  if (state === 'play') {
    const tb = TRAY.box;
    shape('rgba(42,29,46,.82)', () => g.roundRect(tb.x, tb.y, tb.w, tb.h, 28), 0);
    TRAY.forEach((b, i) => {
      const on = i === sel, it = ITEMS[i];
      if (on) {
        shape(COL.gold, () => g.roundRect(b.x0 + 6, b.y0 + 6, b.w - 12, b.h - 12, 22), 4);
        if (cool > 0) { g.fillStyle = 'rgba(42,29,46,.28)'; g.beginPath(); g.roundRect(b.x0 + 6, b.y0 + 6, (b.w - 12) * cool / it.cool, b.h - 12, 22); g.fill(); }
      }
      const bounce = on ? Math.sin(performance.now() / 180) * 2 : 0;
      drawItem(it.key, b.x, b.y - (PORTRAIT ? 14 : 10) + bounce, it.r * (on ? 1.15 : .95), -.2);
      label(it.name, b.x, b.y0 + b.h - (PORTRAIT ? 22 : 17), PORTRAIT ? 20 : 17, on ? OUT : '#fff0d6', 'center', null);
    });
  }
}
function titleScreen(t) {

function overScreen(t) {

  g.save(); g.translate(0, TY);

  const lead = Object.entries(board).sort((a, b) => b[1].best - a[1].best)[0];

function boardScreen() {
  g.fillStyle = 'rgba(42,29,46,.72)'; g.fillRect(0, 0, VW, VH);
  g.save(); g.translate(0, TY);
  shape(COL.cream, () => g.roundRect(VW / 2 - 290, 70, 580, 480, 30), 6);

    label(`${pts}`, VW / 2 + 210, y + 2, 40, lead ? '#e0a32e' : OUT, 'right', null);

  label(SCORE_URL ? 'Gemeinsame Bestenliste von euch dreien' : 'Bestenliste auf diesem Gerät', VW / 2, 522, 18, '#8a7a90', 'center', null);

/* ---------------- Schleife ---------------- */
let last = performance.now();
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (shakeT > 0) shakeT -= dt;
  update(dt); render(now);
  requestAnimationFrame(loop);
}
function drawCrowdPerson(x, y, sc, col, skin, hair, pose, t, i) {
  g.save(); g.translate(x, y); g.scale(sc, sc);
  // Arme (Faust hoch / Daumen runter)
  if (pose === 'fist') { limb(18, -40, 34 + Math.sin(t * 8 + i) * 4, -110, 16, col); shape(skin, () => g.arc(36 + Math.sin(t * 8 + i) * 4, -118, 11, 0, 7), 3); }
  if (pose === 'down') { limb(-18, -40, -40, -86, 16, col); shape(skin, () => g.roundRect(-52, -104, 22, 20, 6), 3); limb(-41, -84, -41, -66, 7, skin); }
  shape(col, () => g.roundRect(-38, -50, 76, 90, 30), 4);                          // Schultern
  // von hinten gesehen: Nacken, Ohren, Hinterkopf voller Haare (sie schauen zu Johann)
  shape(skin, () => g.rect(-12, -58, 24, 14), 3);
  for (const e of [-1, 1]) shape(skin, () => g.ellipse(e * 29, -80, 7, 10, 0, 0, 7), 3);
  shape(hair, () => g.ellipse(0, -84, 30, 35, 0, 0, 7), 4);
  g.strokeStyle = 'rgba(0,0,0,.18)'; g.lineWidth = 3; g.beginPath(); g.moveTo(-10, -112); g.quadraticCurveTo(-4, -90, -12, -60); g.moveTo(10, -112); g.quadraticCurveTo(14, -90, 8, -60); g.stroke();
  g.restore();
}
function drawCover(cw, ch, t = 1.2) {

  const c = document.createElement('canvas'); c.width = cw; c.height = ch;
  const saved = g; g = c.getContext('2d');

  g.save(); g.translate(640, 112); g.rotate(-.03);
  shape(COL.cream, () => g.roundRect(-250, -46, 500, 92, 18), 5);
  g.font = FONT(800, 58); g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#e0472f'; g.fillText('JOHANN WUT', -34, 5);
  g.font = '58px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; g.fillText('😡', 196, 2);

  drawPult();
  drawJohann(230, STAGE_Y - 10, .86, { t, mood: 'cry', hands: 'raute', duck: 0, walk: 0, stains });
  // fliegende Tomate

  // Publikum vorne (buht)
  const cols = ['#5b4a8a', '#3a7f8f', '#c23a48', '#7a5c86', '#e0a32e', '#4a6b9a', '#8a3a6a'], skins = ['#f3cdb2', '#e0b08c', '#c98f6a', '#f6d3bf'], hairs = ['#3a2a1e', '#8b6640', '#e9c66d', '#1a1418', '#a0522d'];
  const poses = ['fist', 'none', 'down', 'fist', 'none', 'down', 'fist', 'none', 'fist'];
  for (let i = 0; i < 9; i++) drawCrowdPerson(60 + i * 112 + (i % 2) * 20, 532 + (i % 2) * 14, 1.05, cols[i % cols.length], skins[i % 4], hairs[i % 5], poses[i], t, i);
  // „BUH!"-Rufe
  [['BUH!', 470, 400, -.15], ['BUUUH!', 700, 300, .1], ['BUH!', 880, 380, .18], ['Buh!', 90, 330, -.2]].forEach(([w, x, y, r]) => {
    g.save(); g.translate(x, y); g.rotate(r); g.font = FONT(800, 44); g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';

}
window.drawCover = drawCover;
