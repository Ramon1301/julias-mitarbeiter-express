<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0a1d">
<title>Julias Mitarbeiter Express – GIG</title>
<meta name="description" content="Gemeinsame Aufgabenliste von Julia, Joris und Ramon">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23a855f7'/><stop offset='1' stop-color='%23f97316'/></linearGradient></defs><rect width='100' height='100' rx='26' fill='url(%23g)'/><text x='50' y='68' font-size='52' text-anchor='middle'>🚀</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0a1d; --surface:#17142e; --surface-2:#211d3f; --border:#2e2955; --text:#f3f1ff; --muted:#a29cc9;
  --grad:linear-gradient(135deg,#a855f7 0%,#ec4899 50%,#f97316 100%);
  /* Personenfarben – überall gleich. -2 ist nur eine kräftigere Stufe derselben Farbe */
  --ramon:#38bdf8; --ramon-2:#0ea5e9;
  --joris:#4ade80; --joris-2:#22c55e;
  --julia:#f472b6; --julia-2:#ec4899;
  --p1:#4ade80; --p2:#facc15; --p3:#f43f5e;
  --ok:#4ade80;
  --doing:#a78bfa;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;min-height:100vh;
  background-image:radial-gradient(900px 500px at 10% -10%,rgba(168,85,247,.13),transparent 60%),radial-gradient(800px 500px at 100% 0%,rgba(249,115,22,.07),transparent 60%);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
*{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid #c084fc;outline-offset:2px;border-radius:10px}
::selection{background:rgba(236,72,153,.35)}
.hidden{display:none!important}

[data-p="Ramon"]{--c:var(--ramon);--c2:var(--ramon-2)}
[data-p="Joris"]{--c:var(--joris);--c2:var(--joris-2)}
[data-p="Julia"]{--c:var(--julia);--c2:var(--julia-2)}
[data-p="none"]{--c:#8b85b5;--c2:#5b557f}
.avatar{position:relative;overflow:hidden;border-radius:50%;background:linear-gradient(135deg,var(--c),var(--c2));color:#0c0a1d;display:inline-flex;align-items:center;justify-content:center;font-weight:800;flex:none;width:26px;height:26px;font-size:12px}
.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

/* ---------- Titel ---------- */
.brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand h1{margin:0;font-size:22px;font-weight:900;letter-spacing:-.02em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .dash{color:var(--muted);font-weight:700}
.gig{font-weight:900;font-size:14px;letter-spacing:.04em;padding:3px 9px;border-radius:8px;background:var(--grad);color:#fff;transform:rotate(-3deg)}

/* ---------- Login ---------- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.login-card{width:100%;max-width:560px;text-align:center}
.login-card .brand{justify-content:center;margin-bottom:10px}
.login-card .brand h1{font-size:34px}
.login-card .gig{font-size:18px}
.login-card p{color:var(--muted);margin:0 0 30px;font-size:16px}
.people{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.person-btn{border:0;border-radius:22px;padding:26px 10px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;color:#0c0a1d;background:linear-gradient(145deg,var(--c),var(--c2));transition:transform .15s}
.person-btn .avatar{width:62px;height:62px;font-size:26px;background:rgba(255,255,255,.3);color:#0c0a1d;box-shadow:0 0 0 3px rgba(255,255,255,.55)}
.person-btn strong{font-size:18px;font-weight:800}
.person-btn small{font-size:12px;font-weight:600;opacity:.75}

/* ---------- App ---------- */
header{position:sticky;top:0;z-index:20;background:rgba(12,10,29,.75);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.bar{max-width:880px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;justify-content:space-between}
.me-btn{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:4px 12px 4px 4px;font-weight:600;font-size:13px;white-space:nowrap}
.me-btn small{color:var(--muted);font-weight:500}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none;box-shadow:0 0 8px var(--ok);margin-left:6px}
.sync-dot.busy{background:var(--p2);box-shadow:0 0 8px var(--p2)}
.sync-dot.err{background:var(--p3);box-shadow:0 0 8px var(--p3)}

main{max-width:880px;margin:0 auto;padding:24px 16px 110px}
.hello{margin-bottom:20px}
.hello h2{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em}
.hello p{margin:4px 0 0;color:var(--muted)}

/* Dashboard */
.brand-btn{background:none;border:0;padding:0;text-align:left}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:32px}
.tile{position:relative;border:1px solid var(--border);background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,0)),var(--surface);box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 14px 30px -22px rgba(0,0,0,.9);border-radius:22px;padding:20px;text-align:left;display:flex;flex-direction:column;gap:14px;min-height:190px;transition:transform .15s,border-color .15s}
.tile .ico{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);color:var(--text);border:1px solid var(--border)}
.tile h3{margin:0;font-size:20px;font-weight:800}
.tile p{margin:2px 0 0;color:var(--muted);font-size:14px}
.tile .nums{display:flex;gap:18px;margin-top:auto}
.tile .nums b{display:block;font-size:24px;font-weight:800;line-height:1.1}
.tile .nums span{font-size:12px;color:var(--muted);font-weight:600;display:inline-flex;align-items:center;gap:6px}
.tile .nums span i{width:7px;height:7px;border-radius:50%;background:var(--dc)}
.tile .go{position:absolute;right:20px;top:20px;color:var(--muted);font-weight:700;font-size:13px}
.tile.soon{border-style:dashed;background:transparent;cursor:default}
.pnexts{display:flex;flex-direction:column;gap:7px;margin-top:auto}
.tile .pnext-label{margin:0 0 2px;color:var(--muted);font-size:14px}
.pnext{display:flex;align-items:center;gap:8px;font-size:13px;min-width:0}
.pnext .avatar{width:22px;height:22px;font-size:10px;box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 60%,transparent)}
.pnext b{font-weight:700;width:42px;flex:none}
.pnext .what{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pnext .when{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.pnext .none{color:var(--muted);flex:1}
.tile .next{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px;min-width:0}
.tile .next b{color:var(--text);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .next i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.tile.soon .ico{color:var(--muted)}
.tile.soon .badge-soon{position:absolute;right:16px;top:16px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:3px 9px}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--muted);font-weight:700;font-size:14px;padding:0;margin-bottom:14px}
.back:hover{color:var(--text)}
@media (max-width:640px){ .tiles{grid-template-columns:1fr} .tile{min-height:0} }

/* Kalender – schlicht, Farbe nur über die Personen */
.cal{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:16px;margin-bottom:22px}
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.cal-head h3{margin:0;font-size:18px;font-weight:800;flex:1}
.cal-nav{width:34px;height:34px;border-radius:10px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);display:flex;align-items:center;justify-content:center}
.cal-today{height:34px;border-radius:10px;border:1px solid var(--border);background:none;color:var(--muted);font-weight:700;font-size:13px;padding:0 12px}
.cal-wds{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-wd{font-size:11px;font-weight:700;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.06em;padding:4px 0 6px}
.cal-weeks{display:flex;flex-direction:column;gap:4px}
/* Eine Woche = Raster aus 7 Spalten. Tage liegen hinten, Terminbalken darüber und dürfen mehrere Spalten überspannen */
.cal-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));column-gap:4px;row-gap:3px;grid-auto-rows:20px;position:relative}
.cal-day{grid-row:1 / -1;border-radius:12px;background:var(--bg);border:1px solid transparent;padding:4px 6px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;color:var(--text);min-height:100%}
.cal-day.out{opacity:.4}
.cal-day .n{font-size:12px;font-weight:700;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none}
.cal-day.today .n{background:var(--text);color:var(--bg)}
.cal-day.sel{border-color:#c084fc;background:color-mix(in srgb,#c084fc 6%,var(--bg))}
.cal-more{font-size:11px;font-weight:700;color:var(--muted);align-self:flex-end;line-height:1}
.cal-bar{position:relative;z-index:1;margin:0 2px;border:0;border-radius:6px;padding:0 7px;height:20px;display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;color:#0c0a1d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;min-width:0}
.cal-bar span{overflow:hidden;text-overflow:ellipsis}
.cal-bar small{font-weight:800;opacity:.7;font-size:10.5px;flex:none}
.cal-bar.cl{border-top-left-radius:0;border-bottom-left-radius:0;margin-left:0}   /* geht in der Vorwoche weiter */
.cal-bar.cr{border-top-right-radius:0;border-bottom-right-radius:0;margin-right:0} /* geht in der nächsten Woche weiter */
.cal-bar:hover{filter:brightness(1.08)}
.evs{display:flex;flex-direction:column;gap:8px;margin-bottom:24px}
.ev{display:flex;gap:14px;align-items:stretch;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:12px 14px;cursor:pointer;text-align:left;width:100%;color:var(--text)}
.ev .ev-bar{width:4px;border-radius:4px;background:linear-gradient(180deg,var(--c),var(--c2));flex:none}
.ev .time{width:84px;flex:none;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.ev .time small{display:block;color:var(--muted);font-weight:500;white-space:nowrap}
.ev .what{flex:1;min-width:0}
.ev .what b{display:block;font-size:15px;word-break:break-word}
.ev .what span{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:13px;margin-top:2px}
.ev .who{align-self:center}
.stack{display:inline-flex}
.stack .avatar+.avatar{margin-left:-8px}
.stack .avatar{box-shadow:0 0 0 2px var(--surface)}
.day-title{display:flex;align-items:center;justify-content:space-between;margin:0 0 10px}
.day-title h4{margin:0;font-size:16px;font-weight:800}
.empty-s{color:var(--muted);font-size:14px;padding:14px;border:1px dashed var(--border);border-radius:14px;text-align:center}
.tp{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:11px 13px;text-align:left;font-weight:700;font-variant-numeric:tabular-nums;color:var(--text)}
.tp.unset{color:var(--muted);font-weight:500}
.ev-when{background:var(--bg);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.ev-when-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 8px 8px 14px;min-height:52px}
.ev-when-row+.ev-when-row{border-top:1px solid var(--border)}
.ev-when-row>span{font-weight:600}
.ev-when-btns{display:flex;gap:6px;min-width:0}
.ev-when .tp{width:auto;background:var(--surface-2);border-color:transparent;padding:8px 12px;border-radius:10px}
.ev-when .tp.time{min-width:68px;text-align:center}
.switch{width:50px;height:30px;border-radius:999px;border:0;background:var(--surface-2);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.switch.on{background:var(--grad)}
.switch.on::after{transform:translateX(20px)}
.tp.date{display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden}
.tp.date span{overflow:hidden;text-overflow:ellipsis}
.tp.date svg{opacity:.6;flex:none}
.dp-head{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 10px}
.dp-head b{font-size:16px}
.dp-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dp-grid span{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding:4px 0;text-transform:uppercase;letter-spacing:.05em}
.dp-d{aspect-ratio:1;border:0;border-radius:12px;background:none;color:var(--text);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.dp-d:hover{background:var(--surface-2)}
.dp-d.out{color:var(--muted);opacity:.45}
.dp-d.today{box-shadow:inset 0 0 0 1.5px var(--border);color:var(--text)}
.dp-d.on{background:var(--grad);color:#fff;box-shadow:none}
.sheet-back{position:fixed;inset:0;z-index:70;background:rgba(5,4,15,.55);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet-back.out{opacity:0;transition:opacity .15s}
.sheet{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);border-bottom:0;border-radius:22px 22px 0 0;padding:10px 14px 22px;box-shadow:0 -20px 60px rgba(0,0,0,.5);animation:up .2s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media (min-width:641px){ .sheet-back{align-items:center} .sheet{border-radius:22px;border-bottom:1px solid var(--border)} }
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 10px}
.sheet-head b{font-size:15px}
.sheet-btn{background:none;border:0;color:var(--muted);font-weight:600;font-size:14px;padding:8px 6px}
.sheet-btn.ok{color:#c084fc;font-weight:800}
.wheels{position:relative;display:flex;justify-content:center;align-items:center;gap:6px;height:200px}
.wheels .band{position:absolute;left:0;right:0;top:80px;height:40px;border-radius:12px;background:var(--surface-2);pointer-events:none}
.wheel{position:relative;width:78px;height:200px;overflow-y:scroll;scroll-snap-type:y mandatory;padding:80px 0;scrollbar-width:none;-webkit-mask-image:linear-gradient(180deg,transparent,#000 35%,#000 65%,transparent);mask-image:linear-gradient(180deg,transparent,#000 35%,#000 65%,transparent);overscroll-behavior:contain}
.wheel::-webkit-scrollbar{display:none}
.wi{height:40px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;font-size:22px;font-weight:700;color:var(--muted);opacity:.55;font-variant-numeric:tabular-nums;cursor:pointer;transition:color .12s,opacity .12s}
.wi.on{color:var(--text);opacity:1}
.colon{position:relative;font-size:22px;font-weight:800}
.loc-link{color:var(--text);text-decoration:underline;text-decoration-color:var(--border);text-underline-offset:3px}
@media (max-width:640px){
  .cal{padding:8px}
  .cal-wds,.cal-weeks{gap:2px}
  .cal-week{column-gap:2px;row-gap:2px;grid-auto-rows:16px}
  .cal-day{padding:3px 2px;align-items:center;border-radius:9px}
  .cal-day .n{font-size:11px;width:20px;height:20px}
  .cal-bar{height:16px;font-size:9.5px;padding:0 4px;border-radius:4px;margin:0 1px;pointer-events:none} /* aufs Handy: Tippen wählt den Tag */
  .cal-bar small{display:none}
  .cal-more{font-size:9.5px;align-self:center}
}

/* Personen = Aufgabe anlegen */
.section-label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:0 0 10px}
.team{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:28px}
.team-card{border:0;border-radius:20px;padding:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 12px 26px -18px var(--c);text-align:left;color:#0c0a1d;background:linear-gradient(145deg,var(--c),var(--c2));display:flex;flex-direction:column;gap:12px;transition:transform .15s;position:relative;overflow:hidden}
.team-card .top{display:flex;align-items:center;gap:10px}
.team-card .avatar{width:44px;height:44px;font-size:18px;background:rgba(255,255,255,.3);color:#0c0a1d;box-shadow:0 0 0 2px rgba(255,255,255,.55)}
.team-card strong{font-size:17px;font-weight:800;display:block}
.team-card small{font-size:12px;font-weight:600;opacity:.75}
.team-card .add{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;background:rgba(12,10,29,.82);color:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;transition:background .15s}
.team-card:hover .add{background:#0c0a1d}

/* Tabs */
.tabs{display:flex;gap:6px;margin-bottom:14px;background:var(--surface);border:1px solid var(--border);padding:4px;border-radius:14px;width:fit-content;max-width:100%}
.tabs button{border:0;background:none;border-radius:10px;padding:8px 14px;font-weight:700;font-size:14px;color:var(--muted);white-space:nowrap}
.tabs button.on{background:var(--grad);color:#fff;box-shadow:0 4px 12px -6px rgba(236,72,153,.7)}
.tabs .n{opacity:.75;font-weight:600;margin-left:4px}

/* Aufgaben */
.tasks{display:flex;flex-direction:column;gap:10px}
.task{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0)) ,var(--surface);border:1px solid var(--border);border-radius:18px;padding:16px 18px 14px 24px;display:flex;gap:14px;cursor:pointer;transition:transform .15s,border-color .15s,box-shadow .15s;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 10px 24px -18px rgba(0,0,0,.8)}
/* Strich vorne: weiß = noch nicht angenommen, Personenfarbe = angenommen/erledigt */
.task::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:5px;border-radius:0 5px 5px 0;background:#f3f1ff}
.task.doing::before,.task.done::before{background:var(--stripe)}
.task[data-prio="1"]{--pc:var(--p1)} .task[data-prio="2"]{--pc:var(--p2)} .task[data-prio="3"]{--pc:var(--p3)}
.task.done{opacity:.6}
.task.done .t-title{text-decoration:line-through}
.t-top{display:flex;gap:12px;align-items:flex-start}
.t-top .t-title{flex:1;min-width:0}
.act{border:0;border-radius:999px;padding:7px 14px;font-weight:800;font-size:13px;white-space:nowrap;flex:none;transition:transform .12s,filter .12s}
.act.take{background:var(--grad);color:#fff}
.act.finish{background:var(--ok);color:#0c0a1d}
.task.doing{border-color:color-mix(in srgb,var(--c) 35%,var(--border))}
.pill.doing{background:rgba(167,139,250,.16);color:var(--doing);border-color:rgba(167,139,250,.25)}
.pill.doing i{width:7px;height:7px;border-radius:50%;background:var(--doing);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.pill.donep{background:rgba(74,222,128,.16);color:var(--ok)}
.t-body{flex:1;min-width:0}
.t-title{font-weight:700;font-size:16px;word-break:break-word}
.t-desc{color:var(--muted);font-size:13.5px;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;word-break:break-word}
.t-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;border-radius:999px;padding:0 10px 0 8px;font-weight:650;font-size:12px;background:var(--surface-2);color:var(--muted);white-space:nowrap;border:1px solid rgba(255,255,255,.04)}
.pill.prio{background:color-mix(in srgb,var(--pc) 18%,transparent);color:var(--pc)}
.pill.person{background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c);padding-left:3px;border-color:color-mix(in srgb,var(--c) 22%,transparent)}
.pill.person .avatar{width:18px;height:18px;font-size:9px}
.pill.due{background:transparent;border-color:var(--border);color:var(--text);font-weight:600}
.pill.due svg{opacity:.7}
.pill.due.late{border-style:dashed}
.t-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.05)}
.by{color:var(--muted);font-size:12px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.cmt{display:inline-flex;align-items:center;gap:5px;background:none;border:1px solid transparent;border-radius:10px;padding:4px 7px;color:var(--muted);font-size:12px;flex:none;transition:color .15s,background .15s}
.cmt:hover{color:var(--text);background:var(--surface-2)}
.cmt.has{color:var(--text);background:var(--surface-2);border-color:var(--border)}
.cmt b{font-weight:700}
.by .avatar{width:18px;height:18px;font-size:9px}
.by b{color:var(--text);font-weight:600}

.empty{text-align:center;padding:44px 16px;color:var(--muted);background:var(--surface);border:1px dashed var(--border);border-radius:18px}
.empty .big{font-size:40px;display:block;margin-bottom:6px}
.empty strong{display:block;color:var(--text);font-size:17px;margin-bottom:4px}


.fab{position:fixed;right:max(20px,calc(50% - 420px));bottom:24px;width:62px;height:62px;border-radius:20px;border:0;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;z-index:30;box-shadow:0 8px 20px -8px rgba(0,0,0,.6);transition:transform .15s}

/* Fenster */
.overlay{position:fixed;inset:0;background:rgba(5,4,15,.7);backdrop-filter:blur(4px);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px 16px;overflow:auto;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:24px;width:100%;max-width:560px;box-shadow:0 30px 80px rgba(0,0,0,.5);animation:pop .18s;overflow:hidden}
@keyframes pop{from{transform:translateY(12px) scale(.98);opacity:0}}
.modal-head{display:flex;align-items:center;gap:10px;padding:20px 20px 0}
.modal-head h3{margin:0;font-size:20px;font-weight:800;flex:1;word-break:break-word}
.modal-body{padding:16px 20px}
.modal-foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;align-items:center;padding:0 20px 20px}
.modal-foot .act{padding:11px 18px;font-size:15px;border-radius:14px}
.modal-foot .btn,.modal-foot .act{display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.x-btn{background:var(--surface-2);border:0;border-radius:12px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.field{margin-bottom:16px}
.field>label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:7px;text-transform:uppercase;letter-spacing:.06em}
.field input,.field textarea{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:11px 13px;outline:none}
.field input:focus,.field textarea:focus{border-color:#a855f7;box-shadow:0 0 0 3px rgba(168,85,247,.25)}
.field textarea{min-height:100px;resize:vertical}
.pick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pick.who{grid-template-columns:repeat(4,minmax(0,1fr))}
.pick button{border:2px solid var(--border);background:var(--bg);border-radius:14px;padding:10px 6px;font-weight:700;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);transition:all .12s}
.pick button .emo{font-size:22px;line-height:1}
.pick button .avatar{width:28px;height:28px;font-size:12px}
.pick button.on{border-color:var(--pc,var(--c));background:color-mix(in srgb,var(--pc,var(--c)) 16%,transparent);color:var(--pc,var(--c))}
.pick button[data-prio="1"]{--pc:var(--p1)} .pick button[data-prio="2"]{--pc:var(--p2)} .pick button[data-prio="3"]{--pc:var(--p3)}
.btn{border:0;border-radius:14px;padding:11px 18px;font-weight:700;display:inline-flex;align-items:center;gap:8px;background:var(--surface-2);color:var(--text)}
.btn-primary{background:var(--grad);color:#fff}
.btn-ok{background:var(--ok);color:#0c0a1d}
.btn-link{background:none;color:var(--muted);padding:11px 8px;margin-right:auto;font-weight:600}
.btn-link:hover{color:var(--p3)}
.info{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.desc{white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:12px 14px;font-size:14.5px}
.desc.none{color:var(--muted);font-style:italic}
.comments{display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
.comment{display:flex;gap:10px}
.comment .bubble{background:var(--bg);border:1px solid var(--border);border-radius:4px 14px 14px 14px;padding:8px 12px;flex:1;font-size:14px;white-space:pre-wrap;word-break:break-word}
.comment .bubble small{display:block;color:var(--muted);font-size:11px;margin-bottom:2px}
.c-form{display:flex;gap:8px}
.c-form input{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:10px 13px;outline:none;min-width:0}

.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:14px;font-weight:700;font-size:14px;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:pop .2s;white-space:nowrap}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:90}

@media (max-width:640px){
  .brand{gap:6px}
  .brand h1{font-size:16px}
  .gig{font-size:11px;padding:2px 7px}
  .me-btn>span:not(.avatar){display:none}
  .me-btn{padding:4px}
  .team{gap:8px}
  .team-card{padding:12px 8px;align-items:center;text-align:center;gap:8px}
  .team-card .top{flex-direction:column;gap:6px}
  .team-card strong{font-size:15px}
  .team-card .add{align-self:center;padding:5px 10px;font-size:12px}
  .team-card .add span{display:none}
  .hello h2{font-size:22px}
  .login-card .brand h1{font-size:26px}
}
@media (max-width:480px){
  .modal-foot{display:grid;grid-template-columns:1fr 1fr}
  .modal-foot .act,.modal-foot #d-reopen{grid-column:1/-1;order:-1}
  .modal-foot .btn-link{margin-right:0;border:1px solid var(--border)}
  .modal-foot .btn-primary{grid-column:1/-1}
  .people{grid-template-columns:1fr}
  .person-btn{flex-direction:row;padding:14px 18px;text-align:left}
  .person-btn .avatar{width:44px;height:44px;font-size:18px}
  .person-btn small{margin-left:auto}
  .pick.who{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (hover:hover){
  .person-btn:hover{transform:translateY(-4px) scale(1.02)}
  .tile:not(.soon):hover{transform:translateY(-3px);border-color:#4a4380}
  .team-card:hover{transform:translateY(-3px)}
  .task:hover{transform:translateY(-2px);border-color:#3d3770;box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 14px 30px -18px rgba(0,0,0,.9)}
  .act:hover{transform:scale(1.05);filter:brightness(1.1)}
  .fab:hover{transform:scale(1.07) rotate(90deg)}
}
/* iPhone zoomt bei Eingabefeldern unter 16px automatisch rein – verhindern */
@media (max-width:640px){ .field input,.field textarea,.c-form input{font-size:16px} }
.act:active,.btn:active,.cmt:active,.fab:active{transform:scale(.96)}
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>

<!-- ============ Wer bist du? ============ -->
<section id="login" class="hidden">
  <div class="login-card">
    <div class="brand"><h1>Julias Mitarbeiter Express</h1><span class="dash">–</span><span class="gig">GIG</span></div>
    <p>Hey! 👋 Wer bist du?</p>
    <div class="people" id="peoplePick"></div>
  </div>
</section>

<!-- ============ App ============ -->
<section id="app" class="hidden">
  <header>
    <div class="bar">
      <button class="brand brand-btn" data-go="dash" title="Zum Dashboard"><h1>Julias Mitarbeiter Express</h1><span class="dash">–</span><span class="gig">GIG</span></button>
      <button class="me-btn" id="meBtn" title="Person wechseln"></button>
    </div>
  </header>

  <main>
    <!-- Dashboard -->
    <div id="dashView">
      <div class="hello"><h2 id="helloTitle"></h2><p id="dashSub"></p></div>
      <p class="section-label">Bereiche</p>
      <div class="tiles" id="tiles"></div>
    </div>

    <!-- Kalender -->
    <div id="calView" class="hidden">
      <button class="back" data-go="dash">← Dashboard</button>
      <div class="hello"><h2>Kalender</h2><p>Tippe auf einen Tag, um seine Termine zu sehen.</p></div>
      <div class="cal" id="cal"></div>
      <div id="dayList"></div>
    </div>

    <!-- To-Do-Liste -->
    <div id="todoView" class="hidden">
      <button class="back" data-go="dash">← Dashboard</button>
      <div class="hello"><h2>To-Do-Liste</h2><p id="helloSub"></p></div>

      <p class="section-label">Neue Aufgabe für …</p>
      <div class="team" id="team"></div>

      <div class="tabs" id="tabs"></div>
      <div id="content"></div>
    </div>
  </main>

  <button class="fab" id="fab" aria-label="Neue Aufgabe" title="Neue Aufgabe"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
</section>

<section id="locked" class="hidden" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;text-align:center">
  <div><div style="font-size:48px">🔒</div><div class="brand" style="justify-content:center;margin:8px 0"><h1>Julias Mitarbeiter Express</h1><span class="dash">–</span><span class="gig">GIG</span></div>
  <p style="color:var(--muted)">Bitte öffne die Seite über deinen persönlichen Einladungslink.</p></div>
</section>

<div id="modalRoot"></div>
<canvas id="confetti"></canvas>

<script>
function load(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }

/* ===================== Konfiguration ===================== */
// Gemeinsamer Speicher: textdb.dev (kostenlos, ohne Konto).
// Der geheime Schlüssel steht NICHT im Code, sondern nur im Einladungslink (…/#k=SCHLÜSSEL).
// Ohne diesen Link kommt niemand an die Aufgaben. Einmal geöffnet, merkt sich der Browser den Schlüssel.
const hashKey = new URLSearchParams(location.hash.slice(1)).get('k');
if (hashKey) save('todo.key', hashKey);
const STORE_KEY = hashKey || load('todo.key', null);
const STORE_URL = 'https://textdb.dev/api/data/' + STORE_KEY;
const POLL_MS = 5000;

const PEOPLE = ['Julia', 'Joris', 'Ramon'];
const PRIOS = {
  1: { label: 'Nicht so wichtig', emo: '🌱' },
  2: { label: 'Wichtig', emo: '⚡' },
  3: { label: 'Sehr wichtig', emo: '🔥' },
};

/* ===================== State ===================== */
let me = load('todo.me', null);
let data = load('todo.cache', { tasks: [], activity: [], rev: 0 });
let tab = load('todo.tab', 'open');
let view = 'dash'; // Start immer auf dem Dashboard
let lastRaw = null;
let openDetailId = null;


/* ===================== Sync ===================== */
let syncState = '';
function setSync(s) { syncState = s; const d = document.querySelector('.sync-dot'); if (d) d.className = 'sync-dot ' + s; }

function normalize(d) {
  d.tasks ||= []; d.activity ||= []; d.events ||= []; d.rev ||= 0;
  // Teilnehmer eines Termins (ältere Termine: nur wer ihn eingetragen hat)
  d.events.forEach(e => {
    if (!Array.isArray(e.people) || !e.people.length) e.people = [e.createdBy];
    if (!e.endDate || e.endDate < e.date) e.endDate = e.date; // mehrtägige Termine: letzter Tag
  });
  d.tasks.forEach(t => {
    if (t.prio > 3) t.prio = 3;
    // ältere Aufgaben hatten nur eine Person (assignee) → Liste daraus machen
    if (!Array.isArray(t.assignees)) t.assignees = t.assignee ? [t.assignee] : [];
    if (!Array.isArray(t.workers)) t.workers = t.status !== 'open' && t.assignee ? [t.assignee] : [];
  });
  return d;
}
async function fetchRemote() {
  const r = await fetch(STORE_URL + '?t=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const txt = await r.text();
  return normalize(txt.trim() ? JSON.parse(txt) : {});
}
async function pushRemote(d) {
  const r = await fetch(STORE_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(d) });
  if (!r.ok) throw new Error('HTTP ' + r.status);
}
let pending = 0;
async function pull() {
  if (pending) return;
  try {
    const remote = await fetchRemote();
    const raw = JSON.stringify(remote);
    setSync('');
    if (raw !== lastRaw && !pending) { lastRaw = raw; data = remote; save('todo.cache', data); render(); }
  } catch { setSync('err'); }
}

// Jede Änderung: neuesten Stand holen, Änderung anwenden, zurückschreiben – so gehen Änderungen der anderen nicht verloren.
let queue = Promise.resolve();
function mutate(fn, activity) {
  fn(data); if (activity) addActivity(data, activity); render();
  pending++;
  queue = queue.then(async () => {
    setSync('busy');
    try {
      const remote = await fetchRemote();
      fn(remote); if (activity) addActivity(remote, activity);
      remote.rev++;
      await pushRemote(remote);
      data = remote; lastRaw = JSON.stringify(remote); save('todo.cache', data);
      setSync(''); render();
    } catch { setSync('err'); toast('Konnte nicht speichern – Internet prüfen'); }
    finally { pending--; }
  });
}
function addActivity(d, text) { d.activity.unshift({ who: me, text, at: Date.now() }); d.activity = d.activity.slice(0, 40); }

/* ===================== Helpers ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
// Profilbilder liegen (wie die Aufgaben) hinter dem geheimen Schlüssel, nicht öffentlich auf GitHub.
// Fehlt ein Bild, wird der Anfangsbuchstabe gezeigt.
let PHOTOS = load('todo.photos', {});
const avatar = p => `<span class="avatar" data-p="${p ? esc(p) : 'none'}">${p ? esc(p[0]) : '?'}${PHOTOS[p] ? `<img src="${PHOTOS[p]}" alt="">` : ''}</span>`;
const personPill = p => `<span class="pill person" data-p="${esc(p)}">${avatar(p)}${esc(p)}</span>`;
const prioPill = n => `<span class="pill prio" style="--pc:var(--p${n})">${PRIOS[n].emo} ${PRIOS[n].label}</span>`;
const chatSvg = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>';
const calSvg = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';
const xSvg = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';

function dueInfo(t) {
  if (!t.due) return null;
  const day = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
  const days = Math.round((day(t.due) - day(Date.now())) / 864e5);
  const date = new Date(t.due).toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit' });
  let text = `Bis ${date}`, cls = '';
  if (days === 0) text = 'Bis heute';
  else if (days === 1) text = 'Bis morgen';
  else if (days < 0 && t.status !== 'done') { text = `Bis ${date} · überfällig`; cls = 'late'; }
  return { text, cls, days };
}
function ago(ts) {
  const s = (Date.now() - ts) / 1000;
  if (s < 60) return 'gerade eben';
  if (s < 3600) return `vor ${Math.floor(s / 60)} Min.`;
  if (s < 86400) return `vor ${Math.floor(s / 3600)} Std.`;
  if (s < 172800) return 'gestern';
  if (s < 604800) return `vor ${Math.floor(s / 86400)} Tagen`;
  return new Date(ts).toLocaleDateString('de-DE', { day: 'numeric', month: 'short' });
}
function toast(msg) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el); setTimeout(() => el.remove(), 2400);
}
const findTask = (d, id) => d.tasks.find(t => t.id === id);
// assignees = für wen die Aufgabe ist, workers = wer sie angenommen hat
const isFor = (t, p) => t.assignees.includes(p);
const isMine = t => isFor(t, me) || t.workers.includes(me);
const names = list => list.length > 1 ? list.slice(0, -1).join(', ') + ' & ' + list[list.length - 1] : (list[0] || '?');
const pVar = p => `var(--${p.toLowerCase()})`;

/* ===================== Render ===================== */
function render() {
  if (!me) { $('#login').classList.remove('hidden'); $('#app').classList.add('hidden'); renderLogin(); return; }
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');

  const open = data.tasks.filter(t => t.status !== 'done');
  const mine = open.filter(isMine);
  const done = data.tasks.filter(t => t.status === 'done');

  $('#meBtn').innerHTML = `<i class="sync-dot ${syncState}"></i>${avatar(me)}<span>${esc(me)} <small>· wechseln</small></span>`;
  $('#helloTitle').textContent = `Shalom Shalom, ${me}! 👋`;
  const hot = mine.filter(t => t.prio === 3).length;
  // Ansicht umschalten
  $('#dashView').classList.toggle('hidden', view !== 'dash');
  $('#todoView').classList.toggle('hidden', view !== 'todo');
  $('#calView').classList.toggle('hidden', view !== 'cal');
  $('#fab').classList.toggle('hidden', view !== 'todo');
  $('#fab').setAttribute('aria-label', view === 'cal' ? 'Neuer Termin' : 'Neue Aufgabe');
  if (view === 'cal') renderCal();

  const doingAll = data.tasks.filter(t => t.status === 'doing');
  $('#dashSub').textContent = mine.length
    ? `Du hast ${mine.length} offene Aufgabe${mine.length > 1 ? 'n' : ''}${hot ? ` – ${hot}× sehr wichtig 🔥` : '.'}`
    : 'Bei dir ist gerade alles erledigt. ✨';
  // Bereiche – hier können später weitere Kacheln (z. B. Kalender) dazukommen
  $('#tiles').innerHTML = `
    <button class="tile" data-go="todo">
      <span class="go">Öffnen →</span>
      <div class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8.5 9l1.5 1.5L13 7.5M8.5 15.5l1.5 1.5 3-3"/></svg></div>
      <div><h3>To-Do-Liste</h3><p>Aufgaben anlegen, annehmen, erledigen</p></div>
      <div class="nums">
        <div><b>${open.filter(t => t.status === 'open').length}</b><span style="--dc:#f3f1ff"><i></i>offen</span></div>
        <div><b>${doingAll.length}</b><span style="--dc:var(--doing)"><i></i>in Bearbeitung</span></div>
        <div><b>${mine.length}</b><span style="--dc:var(--c)" data-p="${esc(me)}"><i></i>für dich</span></div>
      </div>
    </button>
    ${calTile()}`;

  if (view !== 'todo') return;
  $('#helloSub').textContent = mine.length
    ? `Du hast ${mine.length} offene Aufgabe${mine.length > 1 ? 'n' : ''}${hot ? ` – ${hot}× sehr wichtig 🔥` : '.'}`
    : 'Bei dir ist gerade alles erledigt. ✨';

  $('#team').innerHTML = PEOPLE.map(p => {
    const n = open.filter(t => isFor(t, p)).length;
    return `<button class="team-card" data-p="${p}" data-newfor="${p}">
      <div class="top">${avatar(p)}<div><strong>${p}${p === me ? ' (du)' : ''}</strong><small>${n} offen</small></div></div>
      <span class="add">＋ <span>Aufgabe</span></span></button>`;
  }).join('');

  const tabs = [['open', 'Offen', open.length], ['mine', 'Meine', mine.length], ['done', 'Erledigt', done.length]];
  $('#tabs').innerHTML = tabs.map(([k, l, n]) => `<button data-tab="${k}" class="${tab === k ? 'on' : ''}">${l}<span class="n">${n}</span></button>`).join('');

  let list = tab === 'done' ? done : tab === 'mine' ? mine : open;
  list = list.slice().sort(tab === 'done'
    ? (a, b) => (b.doneAt || 0) - (a.doneAt || 0)
    : (a, b) => b.prio - a.prio || (a.due || 9e15) - (b.due || 9e15) || b.createdAt - a.createdAt);

  $('#content').innerHTML = list.length ? `<div class="tasks">${list.map(taskCard).join('')}</div>` : emptyState();


  if (openDetailId) renderDetail(true);
}

function emptyState() {
  if (!data.tasks.length) return `<div class="empty"><span class="big">🚀</span><strong>Noch keine Aufgaben</strong>Tipp oben auf eine Person, um ihr eine Aufgabe zu geben.</div>`;
  if (tab === 'done') return `<div class="empty"><span class="big">🏁</span><strong>Noch nichts erledigt</strong>Abgehakte Aufgaben landen hier.</div>`;
  return `<div class="empty"><span class="big">🎉</span><strong>Alles erledigt!</strong>Hier ist gerade nichts offen.</div>`;
}

function taskCard(t) {
  const due = dueInfo(t);
  const nC = (t.comments || []).length;
  const owners = t.status === 'done' ? [t.doneBy || t.workers[0]].filter(Boolean) : t.status === 'doing' ? t.workers : [];
  const stripe = owners.length ? ` data-p="${esc(owners[0])}" style="--stripe:${stripes(owners)}"` : '';
  return `<div class="task ${t.status}" data-prio="${t.prio}" data-id="${t.id}"${stripe}>
    <div class="t-body">
      <div class="t-top"><div class="t-title">${esc(t.title)}</div>${actionBtn(t)}</div>
      ${t.desc ? `<div class="t-desc">${esc(t.desc)}</div>` : ''}
      <div class="t-meta">
        ${statusPill(t)}
        ${prioPill(t.prio)}
        ${due ? `<span class="pill due ${due.cls}">${calSvg}${esc(due.text)}</span>` : ''}
      </div>
      <div class="t-foot">
        <span class="by">von ${avatar(t.createdBy)}<b>${esc(t.createdBy)}</b> · ${ago(t.createdAt)}</span>
        <button class="cmt ${nC ? 'has' : ''}" data-comments="${t.id}" aria-label="${nC ? nC + ' Kommentare' : 'Kommentieren'}" title="${nC ? nC + ' Kommentar' + (nC > 1 ? 'e' : '') : 'Kommentieren'}">${chatSvg}${nC ? `<b>${nC}</b>` : ''}</button>
      </div>
    </div>
  </div>`;
}

// Offen → (Annehmen) → In Bearbeitung → (Fertig) → Erledigt
// Annehmen: nur wenn die Aufgabe frei ist oder für mich. Fertig: nur wer sie angenommen hat.
// Bei Aufgaben für mehrere Personen kann jede davon annehmen (auch wenn schon jemand dran ist).
const canTake = t => !t.workers.includes(me) && (t.assignees.length ? isFor(t, me) : true)
  && (t.status === 'open' || (t.status === 'doing' && t.assignees.length > 1));
const canFinish = t => t.status === 'doing' && t.workers.includes(me);
function actionBtn(t) {
  if (canTake(t)) return `<button class="act take" data-advance="${t.id}">🙋 Annehmen</button>`;
  if (canFinish(t)) return `<button class="act finish" data-advance="${t.id}">✓ Fertig</button>`;
  return '';
}
function statusPill(t) {
  if (t.status === 'doing') return `<span class="pill doing"><i></i>In Bearbeitung · ${esc(names(t.workers))}</span>${t.assignees.length > 1 ? forPill(t.assignees) : ''}`;
  if (t.status === 'done') return `<span class="pill donep">✅ Erledigt von ${esc(t.doneBy || names(t.workers))}</span>`;
  return t.assignees.length ? forPill(t.assignees) : '<span class="pill">🙋 noch frei</span>';
}
// Für jede Person ein eigenes Symbol „für Name“ in ihrer Farbe mit Profilbild
function forPill(list) {
  return list.map(p => `<span class="pill person" data-p="${esc(p)}">${avatar(p)}für ${esc(p)}</span>`).join('');
}

function renderLogin() {
  $('#peoplePick').innerHTML = PEOPLE.map(p => {
    const n = data.tasks.filter(t => isFor(t, p) && t.status !== 'done').length;
    return `<button class="person-btn" data-p="${p}" data-login="${p}">${avatar(p)}<strong>${p}</strong><small>${n} offen</small></button>`;
  }).join('');
}

/* ===================== Aktionen ===================== */
function advance(id) {
  const t = findTask(data, id); if (!t) return;
  if (canTake(t)) {
    const joining = t.status === 'doing';
    mutate(d => { const x = findTask(d, id); if (!x) return;
      if (!x.assignees.length) x.assignees = [me];
      if (!x.workers.includes(me)) x.workers.push(me);
      x.assignee = x.assignees[0]; x.status = 'doing'; x.startedAt ||= Date.now();
    }, joining ? `macht bei „${t.title}“ mit 🛠` : `hat „${t.title}“ angenommen 🛠`);
    toast('Angenommen – die anderen sehen jetzt „In Bearbeitung“ 🛠');
  } else if (canFinish(t)) {
    confetti();
    mutate(d => { const x = findTask(d, id); if (x) { x.status = 'done'; x.doneBy = me; x.doneAt = Date.now(); } }, `hat „${t.title}“ erledigt ✅`);
    toast('Erledigt! 🎉');
  }
}
function reopen(id) {
  const t = findTask(data, id); if (!t) return;
  mutate(d => { const x = findTask(d, id); if (x) { x.status = 'open'; x.workers = []; x.doneBy = null; x.doneAt = null; } }, `hat „${t.title}“ wieder geöffnet`);
}

/* ===================== Fenster ===================== */
function closeModal() { $('#modalRoot').innerHTML = ''; openDetailId = null; }

function openEditor(task, presetAssignee) {
  const isNew = !task;
  const t = task ? { ...task, assignees: [...task.assignees] } : { title: '', desc: '', prio: 2, assignees: presetAssignee ? [presetAssignee] : [], due: null };
  const dueVal = t.due ? ymd(new Date(t.due)) : '';
  const heading = isNew ? (presetAssignee ? `Neue Aufgabe für ${presetAssignee === me ? 'dich' : presetAssignee}` : 'Neue Aufgabe') : 'Aufgabe bearbeiten';
  $('#modalRoot').innerHTML = `
  <div class="overlay" data-close>
    <form class="modal" id="editor" autocomplete="off">
      <div class="modal-head"><h3>${esc(heading)}</h3><button type="button" class="x-btn" data-closebtn aria-label="Schließen">${xSvg}</button></div>
      <div class="modal-body">
        <div class="field"><label for="f-title">Was ist zu tun?</label><input id="f-title" required maxlength="140" placeholder="z. B. Lager aufräumen" value="${esc(t.title)}"></div>
        <div class="field"><label for="f-desc">Beschreibung</label><textarea id="f-desc" placeholder="Was genau? Details, Hinweise, Links …">${esc(t.desc)}</textarea></div>
        <div class="field"><label>Wie wichtig?</label><div class="pick" id="f-prio">
          ${Object.entries(PRIOS).map(([k, p]) => `<button type="button" data-prio="${k}" class="${+k === t.prio ? 'on' : ''}"><span class="emo">${p.emo}</span>${p.label}</button>`).join('')}
        </div></div>
        <div class="field"><label>Für wen? <span style="text-transform:none;letter-spacing:0;font-weight:500">(auch mehrere möglich)</span></label><div class="pick who" id="f-who">
          ${PEOPLE.map(p => `<button type="button" data-p="${p}" data-who="${p}" class="${t.assignees.includes(p) ? 'on' : ''}">${avatar(p)}${p}</button>`).join('')}
          <button type="button" data-p="none" data-who="" class="${!t.assignees.length ? 'on' : ''}"><span class="emo">🙋</span>Noch frei</button>
        </div></div>
        <div class="field"><label>Bis wann? <span style="text-transform:none;letter-spacing:0;font-weight:500">(optional)</span></label><button type="button" class="tp date" id="f-due">${calSvg}<span></span></button></div>
      </div>
      <div class="modal-foot">
        <button type="submit" class="btn btn-primary">${isNew ? '🚀 Aufgabe anlegen' : 'Speichern'}</button>
      </div>
    </form>
  </div>`;

  $('#f-prio').onclick = e => { const b = e.target.closest('button'); if (!b) return; t.prio = +b.dataset.prio; $('#f-prio').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); };
  // Mehrfachauswahl: Personen an-/abwählen, „Noch frei“ leert die Auswahl
  $('#f-who').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    const p = b.dataset.who;
    if (!p) t.assignees = [];
    else t.assignees = t.assignees.includes(p) ? t.assignees.filter(x => x !== p) : PEOPLE.filter(x => x === p || t.assignees.includes(x));
    $('#f-who').querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.who ? t.assignees.includes(x.dataset.who) : !t.assignees.length));
  };

  let dueStr = dueVal;
  const drawDue = () => { $('#f-due span').textContent = dueStr ? dateLabel(dueStr) : 'Kein Datum'; $('#f-due').classList.toggle('unset', !dueStr); };
  drawDue();
  $('#f-due').onclick = () => openDatePicker('Bis wann?', dueStr, v => { dueStr = v; drawDue(); }, 'Kein Datum');
  $('#editor').onsubmit = e => {
    e.preventDefault();
    const title = $('#f-title').value.trim(); if (!title) return;
    const due = dueStr ? new Date(dueStr + 'T12:00:00').getTime() : null;
    const patch = { title, desc: $('#f-desc').value.trim(), prio: t.prio, assignees: t.assignees, assignee: t.assignees[0] || null, due };
    if (isNew) {
      const nt = { id: uid(), ...patch, workers: [], status: 'open', createdBy: me, createdAt: Date.now(), comments: [] };
      const others = nt.assignees.filter(p => p !== me);
      const forWho = others.length ? ` für ${names(others)}` : '';
      if (tab === 'done') { tab = 'open'; save('todo.tab', tab); }
      mutate(d => d.tasks.push(nt), `hat „${title}“ angelegt${forWho}`);
      toast('Aufgabe angelegt 🚀');
      closeModal();
    } else {
      mutate(d => { const x = findTask(d, task.id); if (x) Object.assign(x, patch); }, `hat „${title}“ bearbeitet`);
      toast('Gespeichert ✓');
      openDetail(task.id);
    }
  };
  setTimeout(() => $('#f-title').focus(), 60);
}

let lastDetailSig = null;
function openDetail(id) { openDetailId = id; lastDetailSig = null; renderDetail(false); }

function renderDetail(isRefresh) {
  const t = findTask(data, openDetailId);
  if (!t) { closeModal(); return; }
  if (isRefresh && (document.activeElement?.id === 'c-text' || $('#editor'))) return;
  const sig = JSON.stringify([t, me, Object.keys(PHOTOS)]);
  if (isRefresh && sig === lastDetailSig) return;
  lastDetailSig = sig;
  const scrollY = $('.overlay')?.scrollTop || 0;
  const due = dueInfo(t);
  const isDone = t.status === 'done';
  $('#modalRoot').innerHTML = `
  <div class="overlay" data-close>
    <div class="modal">
      <div class="modal-head"><h3>${esc(t.title)}</h3><button class="x-btn" data-closebtn aria-label="Schließen">${xSvg}</button></div>
      <div class="modal-body">
        <div class="info">
          ${statusPill(t)}
          ${prioPill(t.prio)}
          ${due ? `<span class="pill due ${due.cls}">${calSvg}${esc(due.text)}</span>` : ''}
        </div>
        <div class="field"><label>Beschreibung</label><div class="desc ${t.desc ? '' : 'none'}">${t.desc ? esc(t.desc) : 'Keine Beschreibung'}</div></div>
        <div class="field"><label>Kommentare</label>
          <div class="comments">${(t.comments || []).map(c => `<div class="comment">${avatar(c.who)}<div class="bubble"><small><b>${esc(c.who)}</b> · ${ago(c.at)}</small>${esc(c.text)}</div></div>`).join('')}</div>
          <form class="c-form" id="c-form"><input id="c-text" placeholder="Kommentar schreiben …" maxlength="1000"><button class="btn">Senden</button></form>
        </div>
        <div style="color:var(--muted);font-size:12px">Angelegt von <b>${esc(t.createdBy)}</b> · ${new Date(t.createdAt).toLocaleString('de-DE', { dateStyle: 'medium', timeStyle: 'short' })}</div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-link" id="d-del">🗑 Löschen</button>
        <button class="btn" id="d-edit">✏️ Bearbeiten</button>
        ${isDone && (t.doneBy === me || t.createdBy === me) ? '<button class="btn" id="d-reopen">↩︎ Wieder öffnen</button>' : actionBtn(t).replace('class="act', 'id="d-adv" class="act')}
      </div>
    </div>
  </div>`;
  if (isRefresh) { const o = $('.overlay'); o.style.animation = 'none'; $('.modal').style.animation = 'none'; o.scrollTop = scrollY; }

  $('#d-reopen')?.addEventListener('click', () => { closeModal(); reopen(t.id); });
  $('#d-adv')?.addEventListener('click', e => { e.stopPropagation(); closeModal(); advance(t.id); });
  $('#d-edit').onclick = () => { openDetailId = null; openEditor(t); };
  $('#d-del').onclick = () => {
    if (!confirm(`„${t.title}“ wirklich löschen?`)) return;
    closeModal();
    mutate(d => { d.tasks = d.tasks.filter(x => x.id !== t.id); }, `hat „${t.title}“ gelöscht`);
    toast('Gelöscht');
  };
  $('#c-form').onsubmit = e => {
    e.preventDefault();
    const text = $('#c-text').value.trim(); if (!text) return;
    $('#c-text').value = ''; $('#c-text').blur();
    mutate(d => { const x = findTask(d, t.id); if (x) (x.comments ||= []).push({ who: me, text, at: Date.now() }); }, `hat „${t.title}“ kommentiert`);
  };
}


/* ===================== Kalender ===================== */
const MONTHS = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const todayStr = () => ymd(new Date());
let calMonth = new Date(); calMonth.setDate(1);
let calSel = todayStr();
const nowHM = () => new Date().toTimeString().slice(0, 5);
const isUpcoming = e => e.endDate > todayStr() || (e.endDate === todayStr() && (!e.start || (e.end || (e.endDate === e.date ? e.start : '23:59')) >= nowHM()));
const multiDay = e => e.endDate > e.date;
const evSort = (a, b) => (a.date + (a.start || '00:00')).localeCompare(b.date + (b.start || '00:00'));
const eventsOn = day => data.events.filter(e => e.date <= day && day <= e.endDate).sort(evSort);
const fmtDay = (day, opts = { weekday: 'long', day: 'numeric', month: 'long' }) => new Date(day + 'T12:00:00').toLocaleDateString('de-DE', opts);
const timeText = e => e.start ? (e.end ? `${e.start}–${e.end}` : e.start) : 'Ganztägig';
// Zeitraum wie im Apple-Kalender: „Sa., 25. Okt., 22:00 – So., 26. Okt., 04:00“
const shortDay = d => fmtDay(d, { weekday: 'short', day: 'numeric', month: 'short' });
function rangeText(e) {
  if (!multiDay(e)) return `${fmtDay(e.date)} · ${timeText(e)}`;
  if (!e.start) return `${shortDay(e.date)} – ${shortDay(e.endDate)} · ganztägig`;
  return `${shortDay(e.date)}, ${e.start} – ${shortDay(e.endDate)}${e.end ? ', ' + e.end : ''}`;
}
const pinSvg = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';

function calTile() {
  const t = todayStr();
  const tmw = new Date(); tmw.setDate(tmw.getDate() + 1);
  const dayLabel = d => d === t ? 'heute' : d === ymd(tmw) ? 'morgen' : fmtDay(d, { weekday: 'short', day: 'numeric', month: 'numeric' });
  // pro Person: nächster Termin, an dem sie teilnimmt
  const rows = PEOPLE.map(p => {
    const n = data.events.filter(e => isUpcoming(e) && e.people.includes(p)).sort(evSort)[0];
    return `<div class="pnext" data-p="${p}">${avatar(p)}<b>${p}</b>${n
      ? `<span class="what">${esc(n.title)}</span><span class="when">${n.date < t ? 'bis ' + dayLabel(n.endDate) : dayLabel(n.date) + (n.start ? ', ' + n.start : '')}</span>`
      : '<span class="none">keine Termine</span>'}</div>`;
  }).join('');
  return `<button class="tile" data-go="cal">
      <span class="go">Öffnen →</span>
      <div class="ico"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></div>
      <div><h3>Kalender</h3><p>Termine eintragen und im Blick behalten</p></div>
      <div class="pnexts"><p class="pnext-label">Nächster Termin:</p>${rows}</div>
    </button>`;
}

// Strich vor dem Termin: pro Teilnehmer ein gleich langes Stück in seiner Farbe
const stripes = list => list.length === 1 ? pVar(list[0])
  : `linear-gradient(180deg,${list.map((p, i) => `${pVar(p)} ${i * 100 / list.length}% ${(i + 1) * 100 / list.length}%`).join(',')})`;
// Zeit-Spalte in der Tagesliste – bei mehrtägigen Terminen je nach Tag
function dayTime(e, day) {
  if (!multiDay(e)) return `${esc(e.start || 'Ganztägig')}${e.end ? `<small>bis ${esc(e.end)}</small>` : ''}`;
  if (day === e.date) return `${esc(e.start || 'Ganztägig')}<small>bis ${esc(shortDay(e.endDate))}</small>`;
  if (day === e.endDate && e.end) return `bis ${esc(e.end)}`;
  return 'Ganztägig';
}
function evRow(e, day) {
  return `<button class="ev" data-ev="${e.id}" data-p="${esc(e.createdBy)}">
    <span class="ev-bar" style="background:${stripes(e.people)}"></span>
    <span class="time">${dayTime(e, day)}</span>
    <span class="what"><b>${esc(e.title)}</b>${e.location ? `<span>${pinSvg}${esc(e.location)}</span>` : ''}</span>
    <span class="who stack">${e.people.map(avatar).join('')}</span>
  </button>`;
}

// Balkenfarbe: eine Person = ihre Farbe; mehrere = klare Streifen übereinander (kein Verlauf)
const barBg = list => list.length === 1 ? pVar(list[0])
  : `linear-gradient(180deg,${list.map((p, i) => `${pVar(p)} ${i * 100 / list.length}% ${(i + 1) * 100 / list.length}%`).join(',')})`;

function renderCal() {
  const y = calMonth.getFullYear(), m = calMonth.getMonth();
  const first = new Date(y, m, 1);
  const start = new Date(first); start.setDate(1 - ((first.getDay() + 6) % 7)); // Woche beginnt Montag
  const t = todayStr();
  const LANES = matchMedia('(max-width:640px)').matches ? 2 : 3; // so viele Balken pro Tag, Rest als „+n“
  let weeks = '';
  for (let w = 0; w < 6; w++) {
    const days = Array.from({ length: 7 }, (_, i) => { const d = new Date(start); d.setDate(start.getDate() + w * 7 + i); return d; });
    if (w === 5 && days[0].getMonth() !== m) break; // 5 Wochen reichen
    const keys = days.map(ymd), wkStart = keys[0], wkEnd = keys[6];
    // Termine dieser Woche: früher Beginn und längere Termine zuerst, damit Balken sauber übereinander liegen
    const evs = data.events.filter(e => e.date <= wkEnd && e.endDate >= wkStart)
      .sort((a, b) => a.date.localeCompare(b.date) || b.endDate.localeCompare(a.endDate) || (a.start || '').localeCompare(b.start || ''));
    const laneEnd = [], more = Array(7).fill(0), bars = [];
    for (const e of evs) {
      const c1 = Math.max(0, keys.indexOf(e.date) === -1 ? 0 : keys.indexOf(e.date));
      const c2 = keys.indexOf(e.endDate) === -1 ? 6 : keys.indexOf(e.endDate);
      let lane = laneEnd.findIndex(end => end < c1);
      if (lane === -1) lane = laneEnd.length;
      if (lane >= LANES) { for (let c = c1; c <= c2; c++) more[c]++; continue; }
      laneEnd[lane] = c2;
      const cl = e.date < wkStart, cr = e.endDate > wkEnd;
      bars.push(`<button class="cal-bar ${cl ? 'cl' : ''} ${cr ? 'cr' : ''}" data-ev="${e.id}" title="${esc(e.title)}"
        style="grid-column:${c1 + 1} / ${c2 + 2};grid-row:${lane + 2};background:${barBg(e.people)}">${e.start && !cl ? `<small>${esc(e.start)}</small>` : ''}<span>${esc(e.title)}</span></button>`);
    }
    const cells = days.map((d, i) => `<button class="cal-day ${d.getMonth() !== m ? 'out' : ''} ${keys[i] === t ? 'today' : ''} ${keys[i] === calSel ? 'sel' : ''}" data-day="${keys[i]}" style="grid-column:${i + 1}">
        <span class="n">${d.getDate()}</span>${more[i] ? `<span class="cal-more">+${more[i]}</span>` : ''}</button>`).join('');
    // Zeilen: Datum, Balken-Spuren, Platz für „+n“
    weeks += `<div class="cal-week" style="grid-template-rows:${LANES === 2 ? '22px repeat(2,16px) 12px' : '26px repeat(3,20px) 14px'}">${cells}${bars.join('')}</div>`;
  }
  $('#cal').innerHTML = `
    <div class="cal-head">
      <h3>${MONTHS[m]} ${y}</h3>
      <button class="cal-today" data-calnav="0">Heute</button>
      <button class="cal-nav" data-calnav="-1" aria-label="Vorheriger Monat">‹</button>
      <button class="cal-nav" data-calnav="1" aria-label="Nächster Monat">›</button>
    </div>
    <div class="cal-wds">${['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'].map(w => `<div class="cal-wd">${w}</div>`).join('')}</div>
    <div class="cal-weeks">${weeks}</div>`;

  const dayEvs = eventsOn(calSel);
  $('#dayList').innerHTML = `
    <div class="day-title"><h4>${calSel === t ? 'Heute, ' : ''}${fmtDay(calSel)}</h4><button class="btn btn-primary" data-newev style="padding:9px 16px;font-size:14px">＋ Termin</button></div>
    <div class="evs">${dayEvs.length ? dayEvs.map(e => evRow(e, calSel)).join('') : '<div class="empty-s">Keine Termine an diesem Tag</div>'}</div>`;

}

const pad2 = n => String(n).padStart(2, '0');
const addMin = (hm, d) => { let [h, m] = hm.split(':').map(Number); let t = Math.min(Math.max(h * 60 + m + d, 0), 23 * 60 + 55); return `${pad2(Math.floor(t / 60))}:${pad2(t % 60)}`; };
const roundNow = () => { const d = new Date(); let t = d.getHours() * 60 + Math.ceil(d.getMinutes() / 15) * 15 + 60; t = Math.min(t, 23 * 60); return `${pad2(Math.floor(t / 60))}:${pad2(t % 60)}`; };

// Datum-Auswahl als kleiner Kalender im gleichen Look
function openDatePicker(title, value, onDone, clearLabel) {
  const sel = value || todayStr();
  let month = new Date(sel + 'T12:00:00'); month.setDate(1);
  const sheet = document.createElement('div');
  sheet.className = 'sheet-back';
  document.body.appendChild(sheet);
  const draw = () => {
    const y = month.getFullYear(), m = month.getMonth();
    const start = new Date(y, m, 1); start.setDate(1 - ((start.getDay() + 6) % 7));
    let cells = '';
    for (let i = 0; i < 42; i++) {
      const d = new Date(start); d.setDate(start.getDate() + i);
      const k = ymd(d);
      cells += `<button type="button" class="dp-d ${d.getMonth() !== m ? 'out' : ''} ${k === todayStr() ? 'today' : ''} ${k === value ? 'on' : ''}" data-pick="${k}">${d.getDate()}</button>`;
    }
    sheet.innerHTML = `<div class="sheet" role="dialog" aria-label="${esc(title)}">
      <div class="sheet-head">${clearLabel ? `<button type="button" class="sheet-btn" data-clear>${esc(clearLabel)}</button>` : '<span style="width:60px"></span>'}<b>${esc(title)}</b><button type="button" class="sheet-btn" data-today>Heute</button></div>
      <div class="dp-head"><button type="button" class="cal-nav" data-dm="-1" aria-label="Vorheriger Monat">‹</button><b>${MONTHS[m]} ${y}</b><button type="button" class="cal-nav" data-dm="1" aria-label="Nächster Monat">›</button></div>
      <div class="dp-grid">${['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'].map(w => `<span>${w}</span>`).join('')}${cells}</div>
    </div>`;
  };
  draw();
  const close = () => { sheet.classList.add('out'); setTimeout(() => sheet.remove(), 160); };
  sheet._commit = close; // Escape/Rausklicken: Datum bleibt wie es war
  sheet.addEventListener('click', ev => {
    const t = ev.target;
    if (t === sheet) return close();
    const dm = t.closest('[data-dm]'); if (dm) { month = new Date(month.getFullYear(), month.getMonth() + +dm.dataset.dm, 1); return draw(); }
    const pk = t.closest('[data-pick]'); if (pk) { onDone(pk.dataset.pick); return close(); }
    if (t.closest('[data-today]')) { onDone(todayStr()); return close(); }
    if (t.closest('[data-clear]')) { onDone(''); return close(); }
  });
}
// Jahr nur anzeigen, wenn es nicht das aktuelle ist
const dateLabel = d => { if (!d) return ''; const x = new Date(d + 'T12:00:00'); return x.toLocaleDateString('de-DE', { weekday: 'short', day: 'numeric', month: 'short', ...(x.getFullYear() !== new Date().getFullYear() && { year: 'numeric' }) }); };

// Uhrzeit-Auswahl als Scroll-Rad (Stunden 0–23, Minuten in 5er-Schritten)
function openTimePicker(title, value, onDone, clearLabel) {
  const ITEM = 40;
  const hours = Array.from({ length: 24 }, (_, i) => pad2(i));
  const mins = Array.from({ length: 12 }, (_, i) => pad2(i * 5));
  let [h, m] = value.split(':');
  m = pad2(Math.round(+m / 5) * 5 % 60);
  const sheet = document.createElement('div');
  sheet.className = 'sheet-back';
  sheet.innerHTML = `<div class="sheet" role="dialog" aria-label="${esc(title)}">
    <div class="sheet-head"><button type="button" class="sheet-btn" data-clear>${esc(clearLabel)}</button><b>${esc(title)}</b><button type="button" class="sheet-btn ok" data-ok>Fertig</button></div>
    <div class="wheels"><div class="band"></div>
      <div class="wheel" data-w="h">${hours.map(x => `<div class="wi">${x}</div>`).join('')}</div>
      <div class="colon">:</div>
      <div class="wheel" data-w="m">${mins.map(x => `<div class="wi">${x}</div>`).join('')}</div>
    </div></div>`;
  document.body.appendChild(sheet);
  const wheels = [...sheet.querySelectorAll('.wheel')];
  const lists = [hours, mins];
  const idx = w => Math.max(0, Math.min(w.children.length - 1, Math.round(w.scrollTop / ITEM)));
  // nur das Element wechseln, das sich wirklich ändert (ruhiges Scrollen)
  const paint = w => { const i = idx(w); if (w._on === i) return; w.children[w._on]?.classList.remove('on'); w.children[i].classList.add('on'); w._on = i; };
  wheels.forEach((w, k) => {
    w.scrollTop = Math.max(0, lists[k].indexOf(k ? m : h)) * ITEM;
    paint(w);
    let raf = 0;
    w.addEventListener('scroll', () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; paint(w); }); }, { passive: true });
    w.addEventListener('click', ev => { const it = ev.target.closest('.wi'); if (it) w.scrollTo({ top: [...w.children].indexOf(it) * ITEM, behavior: 'smooth' }); });
  });
  const close = () => { sheet.classList.add('out'); setTimeout(() => sheet.remove(), 160); };
  const commit = () => { onDone(`${hours[idx(wheels[0])]}:${mins[idx(wheels[1])]}`); close(); };
  sheet._commit = commit;
  sheet.addEventListener('click', ev => {
    if (ev.target === sheet || ev.target.closest('[data-ok]')) commit(); // Rausklicken übernimmt die Uhrzeit auch
    if (ev.target.closest('[data-clear]')) { onDone(''); close(); }
  });
}

function openEventEditor(ev) {
  const isNew = !ev;
  const e = ev ? { ...ev, people: [...ev.people] } : { title: '', date: calSel, endDate: calSel, start: '', end: '', location: '', note: '', people: [me] };
  $('#modalRoot').innerHTML = `
  <div class="overlay" data-close>
    <form class="modal" id="evEditor" autocomplete="off">
      <div class="modal-head"><h3>${isNew ? 'Neuer Termin' : 'Termin bearbeiten'}</h3><button type="button" class="x-btn" data-closebtn aria-label="Schließen">${xSvg}</button></div>
      <div class="modal-body">
        <div class="field"><label for="e-title">Name des Termins</label><input id="e-title" required maxlength="120" placeholder="z. B. Teammeeting" value="${esc(e.title)}"></div>
        <div class="field"><label>Wann?</label><div class="ev-when">
          <div class="ev-when-row"><span>Ganztägig</span><button type="button" class="switch" id="e-allday" aria-label="Ganztägig"></button></div>
          <div class="ev-when-row"><span>Beginn</span><div class="ev-when-btns"><button type="button" class="tp date" id="e-d1">${calSvg}<span></span></button><button type="button" class="tp time" id="e-t1"></button></div></div>
          <div class="ev-when-row"><span>Ende</span><div class="ev-when-btns"><button type="button" class="tp date" id="e-d2">${calSvg}<span></span></button><button type="button" class="tp time" id="e-t2"></button></div></div>
        </div></div>
        <div class="field"><label for="e-loc">Ort</label><input id="e-loc" maxlength="160" placeholder="z. B. Laden, Hauptstraße 12" value="${esc(e.location)}"></div>
        <div class="field"><label for="e-note">Notiz <span style="text-transform:none;letter-spacing:0;font-weight:500">(optional)</span></label><textarea id="e-note" style="min-height:70px" placeholder="Was sollte man wissen?">${esc(e.note)}</textarea></div>
        <div class="field"><label>Wer nimmt teil? <span style="text-transform:none;letter-spacing:0;font-weight:500">(auch mehrere möglich)</span></label><div class="pick" id="e-who">
          ${PEOPLE.map(p => `<button type="button" data-p="${p}" data-who="${p}" class="${e.people.includes(p) ? 'on' : ''}">${avatar(p)}${p}</button>`).join('')}
        </div></div>
      </div>
      <div class="modal-foot"><button type="submit" class="btn btn-primary">${isNew ? 'Termin eintragen' : 'Speichern'}</button></div>
    </form>
  </div>`;
  // Beginn/Ende wie im Apple-Kalender (auch über mehrere Tage)
  const dayDiff = (a, b) => Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 864e5);
  const shiftDay = (d, n) => { const x = new Date(d + 'T12:00:00'); x.setDate(x.getDate() + n); return ymd(x); };
  const fix = () => { // Ende darf nie vor dem Beginn liegen
    if (e.endDate < e.date) e.endDate = e.date;
    if (e.start && e.end && e.endDate === e.date && e.end <= e.start) {
      const later = addMin(e.start, 60);
      if (later > e.start) e.end = later;
      else { e.endDate = shiftDay(e.date, 1); e.end = '00:55'; } // Beginn kurz vor Mitternacht
    }
  };
  const drawWhen = () => {
    const allDay = !e.start;
    $('#e-allday').classList.toggle('on', allDay);
    $('#e-allday').setAttribute('aria-pressed', allDay);
    $('#e-d1 span').textContent = dateLabel(e.date);
    $('#e-d2 span').textContent = dateLabel(e.endDate);
    $('#e-t1').textContent = e.start; $('#e-t2').textContent = e.end || '–';
    $('#e-t1').classList.toggle('hidden', allDay); $('#e-t2').classList.toggle('hidden', allDay);
  };
  drawWhen();
  $('#e-allday').onclick = () => {
    if (e.start) { e.start = ''; e.end = ''; }
    else { e.start = roundNow(); e.end = addMin(e.start, 60); fix(); }
    drawWhen();
  };
  $('#e-d1').onclick = () => openDatePicker('Beginn', e.date, v => { const n = dayDiff(e.date, v); e.date = v; e.endDate = shiftDay(e.endDate, n); fix(); drawWhen(); });
  $('#e-d2').onclick = () => openDatePicker('Ende', e.endDate, v => { e.endDate = v < e.date ? e.date : v; fix(); drawWhen(); });
  $('#e-t1').onclick = () => openTimePicker('Beginn', e.start, v => { if (!v) { e.start = ''; e.end = ''; } else { e.start = v; fix(); } drawWhen(); }, 'Ganztägig');
  $('#e-t2').onclick = () => openTimePicker('Ende', e.end || addMin(e.start, 60), v => {
    e.end = v;
    // Ende vor dem Beginn am selben Tag → über Nacht, also nächster Tag
    if (v && e.endDate === e.date && v <= e.start) e.endDate = shiftDay(e.date, 1);
    drawWhen();
  }, 'Kein Ende');
  $('#e-who').onclick = x => {
    const b = x.target.closest('button'); if (!b) return;
    const p = b.dataset.who;
    const next = e.people.includes(p) ? e.people.filter(q => q !== p) : PEOPLE.filter(q => q === p || e.people.includes(q));
    if (!next.length) return toast('Mindestens eine Person auswählen');
    e.people = next;
    $('#e-who').querySelectorAll('button').forEach(y => y.classList.toggle('on', e.people.includes(y.dataset.who)));
  };
  $('#evEditor').onsubmit = ev2 => {
    ev2.preventDefault();
    fix();
    const patch = { title: $('#e-title').value.trim(), date: e.date, endDate: e.endDate, start: e.start, end: e.end, location: $('#e-loc').value.trim(), note: $('#e-note').value.trim(), people: e.people };
    if (!patch.title || !patch.date) return;
    if (patch.end && !patch.start) patch.end = '';
    calSel = patch.date; calMonth = new Date(patch.date + 'T12:00:00'); calMonth.setDate(1);
    if (isNew) {
      const ne = { id: uid(), ...patch, createdBy: me, createdAt: Date.now() };
      mutate(d => d.events.push(ne), `hat den Termin „${patch.title}“ eingetragen`);
      toast('Termin eingetragen 📅');
    } else {
      mutate(d => { const x = d.events.find(x => x.id === ev.id); if (x) Object.assign(x, patch); }, `hat den Termin „${patch.title}“ geändert`);
      toast('Gespeichert ✓');
    }
    closeModal();
  };
  setTimeout(() => $('#e-title').focus(), 60);
}

function openEvent(id) {
  const e = data.events.find(x => x.id === id); if (!e) return;
  const maps = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(e.location || '');
  $('#modalRoot').innerHTML = `
  <div class="overlay" data-close>
    <div class="modal" data-p="${esc(e.createdBy)}" style="border-top:4px solid var(--c)">
      <div class="modal-head"><h3>${esc(e.title)}</h3><button class="x-btn" data-closebtn aria-label="Schließen">${xSvg}</button></div>
      <div class="modal-body">
        <div class="kv-list" style="display:flex;flex-direction:column;gap:10px;font-size:15px">
          <div style="display:flex;gap:10px;align-items:center">${calSvg}<span>${esc(rangeText(e))}</span></div>
          ${e.location ? `<div style="display:flex;gap:10px;align-items:center">${pinSvg}<a class="loc-link" href="${maps}" target="_blank" rel="noopener">${esc(e.location)}</a></div>` : ''}
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${forPill(e.people).replaceAll('für ', '')}</div>
          <div style="display:flex;gap:10px;align-items:center;color:var(--muted);font-size:13px">${avatar(e.createdBy)}<span>Eingetragen von <b style="color:var(--text)">${esc(e.createdBy)}</b></span></div>
        </div>
        ${e.note ? `<div class="field" style="margin-top:16px"><label>Notiz</label><div class="desc">${esc(e.note)}</div></div>` : ''}
      </div>
      <div class="modal-foot">
        <button class="btn btn-link" id="ev-del">🗑 Löschen</button>
        <button class="btn" id="ev-edit">✏️ Bearbeiten</button>
      </div>
    </div>
  </div>`;
  $('#ev-edit').onclick = () => openEventEditor(e);
  $('#ev-del').onclick = () => {
    if (!confirm(`Termin „${e.title}“ wirklich löschen?`)) return;
    closeModal();
    mutate(d => { d.events = d.events.filter(x => x.id !== e.id); }, `hat den Termin „${e.title}“ gelöscht`);
    toast('Termin gelöscht');
  };
}

/* ===================== Konfetti ===================== */
function confetti() {
  const cv = $('#confetti'), ctx = cv.getContext('2d');
  cv.width = innerWidth; cv.height = innerHeight;
  const cols = ['#a855f7', '#ec4899', '#f97316', '#facc15', '#4ade80', '#38bdf8'];
  const ps = Array.from({ length: 110 }, () => ({ x: innerWidth / 2, y: innerHeight * .65, vx: (Math.random() - .5) * 16, vy: -Math.random() * 15 - 5, r: Math.random() * 7 + 3, c: cols[Math.random() * cols.length | 0], a: Math.random() * 6 }));
  let f = 0;
  (function tick() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .45; p.a += .2; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * .6); ctx.restore(); });
    if (++f < 100) requestAnimationFrame(tick); else ctx.clearRect(0, 0, cv.width, cv.height);
  })();
}

/* ===================== Events ===================== */
document.addEventListener('click', e => {
  const el = e.target;
  const login = el.closest('[data-login]');
  if (login) { me = login.dataset.login; save('todo.me', me); render(); return; }
  if (el.closest('[data-closebtn]') || el.matches('[data-close]')) { closeModal(); return; }
  const go = el.closest('[data-go]'); if (go) { goTo(go.dataset.go); return; }
  const dayBtn = el.closest('[data-day]'); if (dayBtn) { calSel = dayBtn.dataset.day; const d = new Date(calSel + 'T12:00:00'); if (d.getMonth() !== calMonth.getMonth()) { calMonth = d; calMonth.setDate(1); } render(); return; }
  const cn = el.closest('[data-calnav]'); if (cn) { const k = +cn.dataset.calnav; if (k) calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + k, 1); else { calMonth = new Date(); calMonth.setDate(1); calSel = todayStr(); } render(); return; }
  const evB = el.closest('[data-ev]'); if (evB) { openEvent(evB.dataset.ev); return; }
  if (el.closest('[data-newev]')) { openEventEditor(); return; }
  const nf = el.closest('[data-newfor]'); if (nf) { openEditor(null, nf.dataset.newfor); return; }
  const cm = el.closest('[data-comments]'); if (cm) { openDetail(cm.dataset.comments); setTimeout(() => { const i = $('#c-text'); if (i) { i.scrollIntoView({ block: 'center', behavior: 'smooth' }); i.focus({ preventScroll: true }); } }, 80); return; }
  const adv = el.closest('[data-advance]'); if (adv && !adv.id) { advance(adv.dataset.advance); return; }
  const tb = el.closest('[data-tab]'); if (tb) { tab = tb.dataset.tab; save('todo.tab', tab); render(); return; }
  const card = el.closest('.task[data-id]'); if (card) { openDetail(card.dataset.id); return; }
});
$('#fab').onclick = () => view === 'cal' ? openEventEditor() : openEditor();
// Zurück-Taste im Browser/Handy führt aufs Dashboard
function goTo(v) {
  if (v === view) return;
  if (v !== 'dash') history.pushState({ view: v }, '');
  else if (history.state?.view) { history.back(); return; }
  view = v; closeModal(); render(); scrollTo(0, 0);
}
let resizeT; addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (view === 'cal') renderCal(); }, 150); });
addEventListener('popstate', () => { view = history.state?.view || 'dash'; closeModal(); render(); });
$('#meBtn').onclick = () => { me = null; save('todo.me', null); render(); };
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  const sh = $('.sheet-back'); if (sh) { sh._commit(); return; } // erst die Uhrzeit-Auswahl schließen (Wert übernehmen)
  closeModal();
});

/* ===================== Start ===================== */
if (!STORE_KEY) { $('#locked').classList.remove('hidden'); throw new Error('kein Einladungslink'); }
normalize(data);
render();
pull();
// Profilbilder einmal pro Besuch laden
fetch(STORE_URL + '-fotos?t=' + Date.now(), { cache: 'no-store' }).then(r => r.ok ? r.text() : '').then(txt => {
  if (!txt.trim()) return;
  PHOTOS = JSON.parse(txt); save('todo.photos', PHOTOS); render();
}).catch(() => {});
setInterval(() => { if (!document.hidden) pull(); }, POLL_MS);
document.addEventListener('visibilitychange', () => { if (!document.hidden) pull(); });
setInterval(() => { if (!$('#modalRoot').innerHTML) render(); }, 60000);
</script>
